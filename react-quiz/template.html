<title>React Interview Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: sticky top bar with progress, then a two-column workspace — filters and the
     question map on the left, the question card on the right. One column under 1024px. */
  :root {
    --paper: #f4f6f9;
    --panel: #ffffff;
    --panel-2: #edf1f5;
    --ink: #15202b;
    --ink-soft: #566575;
    --line: #d8dfe7;
    --react: #087ea4;
    --react-soft: #e2f1f6;
    --on-react: #ffffff;
    --pass: #1d7a46;
    --pass-soft: #e1f2e8;
    --retry: #a35700;
    --retry-soft: #faeedd;
    --fail: #b3322e;
    --fail-soft: #fae5e4;
    --code-bg: #f2f5f8;
    --code-kw: #b0306a;
    --code-str: #0b6e4f;
    --code-fn: #6639ba;
    --code-cm: #6b7886;
    --code-tag: #087ea4;
    --code-attr: #8a5300;
    --code-num: #0550ae;
    --shadow: 0 1px 2px rgba(21, 32, 43, 0.05), 0 8px 24px rgba(21, 32, 43, 0.06);

    --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0d131a;
      --panel: #141c25;
      --panel-2: #1b2531;
      --ink: #e3e9ef;
      --ink-soft: #94a3b2;
      --line: #263341;
      --react: #58c4dc;
      --react-soft: #12303a;
      --on-react: #04222b;
      --pass: #4cc38a;
      --pass-soft: #12301f;
      --retry: #f0a64a;
      --retry-soft: #33250f;
      --fail: #f2726c;
      --fail-soft: #3a1817;
      --code-bg: #0a1016;
      --code-kw: #ff7ab2;
      --code-str: #7ee0a8;
      --code-fn: #c4a5ff;
      --code-cm: #7d8b99;
      --code-tag: #58c4dc;
      --code-attr: #f5c26b;
      --code-num: #79c0ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0d131a;
    --panel: #141c25;
    --panel-2: #1b2531;
    --ink: #e3e9ef;
    --ink-soft: #94a3b2;
    --line: #263341;
    --react: #58c4dc;
    --react-soft: #12303a;
    --on-react: #04222b;
    --pass: #4cc38a;
    --pass-soft: #12301f;
    --retry: #f0a64a;
    --retry-soft: #33250f;
    --fail: #f2726c;
    --fail-soft: #3a1817;
    --code-bg: #0a1016;
    --code-kw: #ff7ab2;
    --code-str: #7ee0a8;
    --code-fn: #c4a5ff;
    --code-cm: #7d8b99;
    --code-tag: #58c4dc;
    --code-attr: #f5c26b;
    --code-num: #79c0ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--panel);
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.5; }
  :focus-visible { outline: 2px solid var(--react); outline-offset: 2px; }
  kbd {
    font: 500 11px/1 var(--font-mono);
    padding: 3px 5px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    background: var(--panel-2);
    color: var(--ink-soft);
  }
  .gutter {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .label {
    font: 600 12px/1.2 var(--font-body);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1480px;
    margin: 0 auto;
    padding-block: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 32px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .brand h1 {
    font: 700 22px/1.1 var(--font-display);
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
  }
  .brand h1 span { color: var(--react); }
  .progress-block { flex: 1 1 360px; display: grid; gap: 6px; min-width: 0; }
  .progress { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--panel-2); }
  .progress i { display: block; height: 100%; transition: width 0.3s ease; }
  .progress .known { background: var(--pass); }
  .progress .review { background: var(--retry); }
  .stats { display: flex; flex-wrap: wrap; gap: 2px 18px; font-size: 13px; color: var(--ink-soft); }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .sync {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 99px;
    background: var(--panel-2);
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .sync[data-state="synced"] { background: var(--pass-soft); color: var(--pass); }
  .sync[data-state="offline"], .sync[data-state="readonly"] { background: var(--retry-soft); color: var(--retry); }

  /* ---------- Workspace ---------- */
  .workspace {
    max-width: 1480px;
    margin: 0 auto;
    padding-block: 28px 64px;
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr);
    gap: 40px;
    align-items: start;
  }
  .sidebar {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 96px);
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    display: grid;
    gap: 22px;
    padding-right: 4px;
  }
  .field { display: grid; gap: 6px; }
  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3px;
    background: var(--panel);
  }
  .seg button {
    border: 0;
    background: none;
    padding: 7px 10px;
    border-radius: 7px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .seg button[aria-pressed="true"] { background: var(--react); color: var(--on-react); }
  select, input[type="search"] {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 14px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; }
  .link-btn {
    border: 0;
    background: none;
    color: var(--ink-soft);
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 4px 0;
  }
  .link-btn.armed { color: var(--fail); font-weight: 600; }

  .map-wrap > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .map-wrap > summary::-webkit-details-marker { display: none; }
  .map-wrap > summary::after { content: "▾"; color: var(--ink-soft); font-size: 12px; }
  .map-wrap:not([open]) > summary::after { content: "▸"; }
  .map { display: grid; gap: 14px; margin-top: 12px; }
  .map-title { font-size: 13px; margin: 0 0 6px; color: var(--ink-soft); }
  .map-title code { font: 500 12px var(--font-mono); color: var(--react); margin-right: 6px; }
  .map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; }
  .cell {
    height: 32px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--panel);
    font: 500 13px var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    padding: 0;
  }
  .cell[data-status="known"] { background: var(--pass-soft); border-color: var(--pass); color: var(--pass); }
  .cell[data-status="review"] { background: var(--retry-soft); border-color: var(--retry); color: var(--retry); }
  .cell[aria-current="true"] { outline: 2px solid var(--react); outline-offset: 1px; color: var(--ink); font-weight: 700; }
  .cell.dim { opacity: 0.35; }
  .keys { display: grid; gap: 6px; font-size: 13px; color: var(--ink-soft); }
  .keys div { display: flex; justify-content: space-between; gap: 8px; }

  /* ---------- Quiz card ---------- */
  .main { min-width: 0; }
  .card {
    max-width: 960px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 36px 40px 40px;
    display: grid;
    gap: 26px;
  }
  .card-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; color: var(--ink-soft); }
  .chip {
    display: inline-flex;
    gap: 8px;
    align-items: baseline;
    background: var(--react-soft);
    color: var(--react);
    padding: 4px 12px;
    border-radius: 99px;
    font-weight: 600;
    font-size: 13px;
  }
  .chip code { font: 500 12px var(--font-mono); }
  .count { font-variant-numeric: tabular-nums; }
  .question {
    font: 700 clamp(24px, 2.2vw, 32px)/1.25 var(--font-display);
    letter-spacing: -0.015em;
    margin: 0;
    text-wrap: balance;
  }
  .question code { font: 500 0.82em var(--font-mono); background: var(--panel-2); padding: 1px 6px; border-radius: 6px; }
  .qnum { color: var(--ink-soft); font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border-radius: 10px;
    padding: 10px 18px;
    font-weight: 600;
    border: 1px solid var(--line);
    background: var(--panel);
  }
  .btn.primary { background: var(--react); border-color: var(--react); color: var(--on-react); }
  .btn.primary kbd { background: transparent; color: inherit; border-color: currentColor; opacity: 0.8; }
  .btn.ghost { border-color: var(--react); color: var(--react); background: var(--react-soft); }
  .btn.danger { border-color: var(--fail); color: var(--fail); background: var(--fail-soft); }

  .editor { display: grid; gap: 10px; }
  textarea {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    padding: 14px 16px;
    font-size: 16px;
    line-height: 1.6;
  }
  textarea:focus { border-color: var(--react); outline: none; box-shadow: 0 0 0 3px var(--react-soft); }
  .editor-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .editor-bar .hint-inline { margin-left: auto; font-size: 13px; color: var(--ink-soft); }
  .status-line { margin: 0; font-size: 14px; color: var(--ink-soft); min-height: 1.6em; }
  .status-line.error { color: var(--fail); }
  .note { margin: 0; font-size: 14px; color: var(--ink-soft); }

  .result {
    border-radius: 14px;
    padding: 22px 24px;
    display: grid;
    gap: 16px;
    border: 1px solid var(--fail);
    background: var(--fail-soft);
  }
  .result.pass { border-color: var(--pass); background: var(--pass-soft); }
  .result-head { display: flex; gap: 20px; align-items: center; }
  .score { font: 700 44px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--fail); white-space: nowrap; }
  .result.pass .score { color: var(--pass); }
  .score span { font-size: 20px; color: var(--ink-soft); }
  .verdict-pill {
    display: inline-block;
    font: 600 12px/1 var(--font-body);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 99px;
    background: var(--fail);
    color: var(--panel);
  }
  .result.pass .verdict-pill { background: var(--pass); }
  .verdict { margin: 8px 0 0; font-size: 17px; }
  .meter { position: relative; height: 6px; border-radius: 99px; background: var(--panel); }
  .meter i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--fail); }
  .result.pass .meter i { background: var(--pass); }
  .meter b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
  .meter-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .feedback { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .feedback ul { margin: 6px 0 0; padding-left: 18px; }
  .feedback li { margin: 3px 0; }
  .tip { margin: 0; }
  .your-answer summary { cursor: pointer; font-size: 14px; color: var(--ink-soft); }
  .your-answer p { white-space: pre-wrap; margin: 8px 0 0; }

  .reference { display: grid; gap: 14px; border-top: 1px dashed var(--line); padding-top: 24px; }
  .self-grade { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .self-grade button { border-radius: 10px; padding: 8px 14px; font-weight: 600; border: 1px solid; display: inline-flex; gap: 8px; align-items: center; }
  .self-grade [data-grade="known"] { color: var(--pass); background: var(--pass-soft); border-color: var(--pass); }
  .self-grade [data-grade="review"] { color: var(--retry); background: var(--retry-soft); border-color: var(--retry); }
  .self-grade button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px currentColor; }

  .quiz-nav { max-width: 960px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
  .quiz-nav button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 18px; font-weight: 500; }
  .pill { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 99px; background: var(--panel-2); color: var(--ink-soft); }
  .pill[data-status="known"] { background: var(--pass-soft); color: var(--pass); }
  .pill[data-status="review"] { background: var(--retry-soft); color: var(--retry); }

  /* ---------- Reference answer markdown ---------- */
  .answer { min-width: 0; font-size: 16.5px; overflow-wrap: anywhere; }
  .answer > :first-child { margin-top: 0; }
  .answer > :last-child { margin-bottom: 0; }
  .answer p, .answer ul, .answer ol { margin: 0 0 14px; max-width: 76ch; }
  .answer ul, .answer ol { padding-left: 22px; }
  .answer li { margin: 4px 0; }
  .answer code { font: 0.86em var(--font-mono); background: var(--panel-2); padding: 1px 5px; border-radius: 5px; }
  .answer pre {
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 18px;
    overflow-x: auto;
    margin: 0 0 16px;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .answer pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; color: var(--ink); }
  .answer blockquote {
    margin: 0 0 14px;
    padding: 10px 16px;
    border-left: 3px solid var(--react);
    background: var(--react-soft);
    border-radius: 0 10px 10px 0;
  }
  .answer blockquote p { margin: 0; }
  .answer a { color: var(--react); }
  .hljs-keyword, .hljs-literal, .hljs-built_in, .hljs-meta { color: var(--code-kw); }
  .hljs-string, .hljs-regexp, .hljs-template-variable { color: var(--code-str); }
  .hljs-title, .hljs-title.function_, .hljs-title.class_ { color: var(--code-fn); }
  .hljs-comment { color: var(--code-cm); font-style: italic; }
  .hljs-name, .hljs-tag { color: var(--code-tag); }
  .hljs-attr, .hljs-attribute, .hljs-property { color: var(--code-attr); }
  .hljs-number { color: var(--code-num); }

  /* ---------- Done + browse ---------- */
  .done { text-align: center; justify-items: center; }
  .done h2 { font: 700 30px/1.2 var(--font-display); margin: 0; }
  .done p { margin: 0; color: var(--ink-soft); }
  .group h2 { font: 700 20px/1.3 var(--font-display); margin: 30px 0 12px; }
  .group h2 code { font: 500 13px var(--font-mono); color: var(--react); margin-right: 10px; }
  .group:first-child h2 { margin-top: 0; }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-width: 960px; }
  .item { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; display: grid; gap: 12px; }
  .item-head { display: flex; gap: 12px; align-items: flex-start; }
  .item-q { flex: 1; font-weight: 600; min-width: 0; }
  .item-q code { font: 0.88em var(--font-mono); background: var(--panel-2); padding: 1px 5px; border-radius: 5px; }
  .item .btn { justify-self: start; padding: 6px 14px; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 8px; background: var(--line); flex: none; }
  .item[data-status="known"] .dot { background: var(--pass); }
  .item[data-status="review"] .dot { background: var(--retry); }
  .score-badge { font: 600 12px var(--font-mono); padding: 3px 8px; border-radius: 99px; background: var(--fail-soft); color: var(--fail); white-space: nowrap; }
  .score-badge.pass { background: var(--pass-soft); color: var(--pass); }
  .item.flash { outline: 2px solid var(--react); }
  .empty { color: var(--ink-soft); padding: 40px 0; }

  @media (max-width: 1023px) {
    .workspace { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 18px 48px; }
    .sidebar { position: static; max-height: none; overflow: visible; padding-right: 0; }
    .keys { display: none; }
    .card { padding: 24px 22px 28px; gap: 20px; }
  }
  @media (max-width: 560px) {
    .card { padding: 20px 16px 24px; border-radius: 14px; }
    .result { padding: 18px 16px; }
    .score { font-size: 36px; }
    .editor-bar .hint-inline { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>

<header class="topbar">
  <div class="topbar-inner gutter">
    <div class="brand">
      <h1>React 19 <span>Interview Quiz</span></h1>
    </div>
    <div class="progress-block">
      <div class="progress" id="progress-bar"></div>
      <div class="stats" id="stats"></div>
    </div>
    <span class="sync" id="sync" data-state="local">Saved in this browser</span>
  </div>
</header>

<div class="workspace gutter">
  <aside class="sidebar" aria-label="Filters and question map">
    <div class="seg" role="group" aria-label="Mode">
      <button type="button" data-mode="quiz">Quiz</button>
      <button type="button" data-mode="browse">Browse</button>
    </div>
    <div class="field">
      <label class="label" for="section-select">Section</label>
      <select id="section-select"></select>
    </div>
    <div class="field">
      <label class="label" for="filter-select">Status</label>
      <select id="filter-select">
        <option value="all">All questions</option>
        <option value="new">Not seen yet</option>
        <option value="review">To review</option>
        <option value="known">Known</option>
      </select>
    </div>
    <div class="field" id="search-field">
      <label class="label" for="search">Search</label>
      <input type="search" id="search" placeholder="useEffect, key, memo…">
    </div>
    <div class="row">
      <label class="check" id="shuffle-wrap"><input type="checkbox" id="shuffle"> Shuffle order</label>
      <button class="link-btn" type="button" id="reset">Reset progress</button>
    </div>
    <details class="map-wrap" id="map-wrap" open>
      <summary class="label">Question map</summary>
      <nav class="map" id="map" aria-label="Jump to question"></nav>
    </details>
    <div class="keys" aria-label="Keyboard shortcuts">
      <p class="label">Keyboard</p>
      <div><span>Write an answer</span><kbd>A</kbd></div>
      <div><span>Grade it</span><kbd>⌘ Enter</kbd></div>
      <div><span>Show / hide more-info</span><kbd>Space</kbd></div>
      <div><span>Previous / next</span><span><kbd>←</kbd> <kbd>→</kbd></span></div>
      <div><span>I knew it / review again</span><span><kbd>1</kbd> <kbd>2</kbd></span></div>
    </div>
  </aside>

  <main class="main" id="view" aria-live="polite"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"
  integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
  integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
<script>
  const QUESTIONS = /*__QUESTIONS__*/[];

  const PASS_SCORE = 7;
  const LS = {
    records: "react-quiz-records-v2",
    legacy: "react-quiz-progress-v1",
    prefs: "react-quiz-prefs-v2",
    drafts: "react-quiz-drafts-v1",
  };
  const SECTIONS = [...new Set(QUESTIONS.map((q) => q.section))];
  const BY_ID = new Map(QUESTIONS.map((q) => [q.id, q]));

  // Browser storage is only a cache here; it can be missing (private window, blocked data).
  function loadJSON(key, fallback) {
    try {
      return JSON.parse(localStorage.getItem(key)) ?? fallback;
    } catch {
      return fallback;
    }
  }
  function saveJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch {}
  }

  // v1 stored { [id]: "known" | "review" }; v2 stores a record per question.
  function loadRecords() {
    const records = loadJSON(LS.records, null);
    if (records) return records;
    const legacy = loadJSON(LS.legacy, {});
    return Object.fromEntries(Object.entries(legacy).map(([id, status]) => [id, { status, updatedAt: 0 }]));
  }

  const prefs = loadJSON(LS.prefs, {});
  const state = {
    mode: prefs.mode === "browse" ? "browse" : "quiz",
    section: SECTIONS.includes(prefs.section) ? prefs.section : "all",
    filter: prefs.filter || "all",
    shuffle: Boolean(prefs.shuffle),
    search: "",
    records: loadRecords(), // { [id]: { status?, answer?, grade?, updatedAt } }
    drafts: loadJSON(LS.drafts, {}), // unsent answers, this browser only
    deck: [],
    index: 0,
    revealed: false, // reference answer visible
    answering: false, // answer editor open
    grading: null, // AbortController while Claude grades
    gradeError: "",
    open: new Set(), // expanded items in browse mode
    cloud: "local", // local | connecting | synced | offline | readonly
    canGrade: null, // null until we know whether Claude grading is available
  };

  let db = null;
  let sample = null;

  const $ = (selector) => document.querySelector(selector);
  const view = $("#view");

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }
  function record(id) {
    return state.records[id] || {};
  }
  function statusOf(id) {
    return record(id).status || "new";
  }
  function currentQuestion() {
    return state.mode === "quiz" ? state.deck[state.index] : undefined;
  }
  // "Section 01 — React Essentials" → { folder: "section-01", name: "React Essentials" }
  function splitSection(section) {
    const match = section.match(/^Section (\d+)\s+—\s+(.+)$/);
    return match ? { folder: `section-${match[1]}`, name: match[2] } : { folder: "", name: section };
  }
  function sectionLabel(section) {
    const { folder, name } = splitSection(section);
    return `${folder ? `<code>${escapeHtml(folder)}</code>` : ""}${escapeHtml(name)}`;
  }

  // ---------- Markdown ----------
  const answerCache = new Map();

  function renderInline(text) {
    return window.marked ? marked.parseInline(text) : escapeHtml(text);
  }
  function renderAnswer(q) {
    if (!answerCache.has(q.id)) {
      const html = window.marked ? marked.parse(q.answer) : `<pre><code>${escapeHtml(q.answer)}</code></pre>`;
      answerCache.set(q.id, html);
    }
    return answerCache.get(q.id);
  }
  function highlightIn(element) {
    if (!window.hljs || !element) return;
    element.querySelectorAll("pre code:not(.hljs)").forEach((block) => hljs.highlightElement(block));
  }

  // ---------- Deck ----------
  function matchesFilters(q) {
    const sectionOk = state.section === "all" || q.section === state.section;
    const filterOk = state.filter === "all" || statusOf(q.id) === state.filter;
    return sectionOk && filterOk;
  }
  function shuffled(list) {
    const copy = [...list];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }
  // Decides which questions the quiz asks and in what order.
  // Tweak here to change the study strategy (e.g. put "review" questions first).
  function buildDeck() {
    const deck = QUESTIONS.filter(matchesFilters);
    return state.shuffle ? shuffled(deck) : deck;
  }
  function resetCard() {
    state.grading?.abort();
    state.grading = null;
    state.revealed = false;
    state.answering = false;
    state.gradeError = "";
  }
  function restartDeck() {
    state.deck = buildDeck();
    state.index = 0;
    resetCard();
  }
  function savePrefs() {
    saveJSON(LS.prefs, {
      mode: state.mode,
      section: state.section,
      filter: state.filter,
      shuffle: state.shuffle,
      lastId: currentQuestion()?.id ?? prefs.lastId,
    });
  }

  // ---------- Saving (browser cache + claude.ai storage) ----------
  const writeChains = new Map();

  function plain(value) {
    return JSON.parse(JSON.stringify(value));
  }
  function saveRecord(id, patch) {
    const next = plain({ ...record(id), ...patch, updatedAt: Date.now() });
    state.records[id] = next;
    saveJSON(LS.records, state.records);
    refreshPassive();
    return pushToCloud(id, next);
  }
  // One write at a time per question document.
  function pushToCloud(id, data) {
    if (!db || state.cloud === "readonly") return Promise.resolve();
    const previous = writeChains.get(id) || Promise.resolve();
    const run = previous.then(() => db.doc(`progress/q-${id}`).set(data)).catch(handleWriteError);
    writeChains.set(id, run);
    return run;
  }
  function handleWriteError(error) {
    if (["invalid_argument", "not_granted", "revoked", "capability_disabled"].includes(error?.code)) {
      setCloud("readonly");
    } else {
      setCloud("offline");
    }
  }
  function setCloud(cloudState) {
    state.cloud = cloudState;
    const sync = $("#sync");
    sync.dataset.state = cloudState;
    sync.textContent = {
      local: "Saved in this browser",
      connecting: "Connecting to claude.ai…",
      synced: "Saved to claude.ai",
      offline: "claude.ai storage unreachable · saving in this browser",
      readonly: "Only the owner saves here · saving in this browser",
    }[cloudState];
  }

  let firstConfirmedSnapshot = true;
  const recordsAtLoad = plain(state.records); // compared once against claude.ai, before cached snapshots replace state
  function applyCloudSnapshot(snapshot) {
    const cloud = {};
    snapshot.docs.forEach((doc) => {
      const match = doc.id.match(/^q-(\d+)$/);
      if (match && doc.exists) cloud[match[1]] = doc.data();
    });
    if (snapshot.metadata.fromCache && snapshot.empty) return;

    if (!snapshot.metadata.fromCache && firstConfirmedSnapshot) {
      firstConfirmedSnapshot = false;
      // Upload anything this browser has that is newer than claude.ai (e.g. progress made offline).
      const newerHere = Object.keys(recordsAtLoad).filter(
        (id) => (recordsAtLoad[id].updatedAt || 0) > (cloud[id]?.updatedAt ?? -1),
      );
      newerHere.forEach((id) => {
        cloud[id] = recordsAtLoad[id];
        pushToCloud(id, recordsAtLoad[id]);
      });
    }

    state.records = plain(cloud);
    saveJSON(LS.records, state.records);
    if (!snapshot.metadata.fromCache && state.cloud !== "readonly") setCloud("synced");
    refreshPassive();
  }

  async function connectClaude() {
    if (!window.claude || typeof window.claude.use !== "function") {
      state.canGrade = false;
      refreshGradeUi();
      return;
    }
    claude.use("sample").then((namespace) => {
      sample = namespace;
      state.canGrade = Boolean(namespace);
      refreshGradeUi();
    });

    const namespace = await claude.use("db");
    if (!namespace) return;
    db = namespace;
    setCloud("connecting");
    let settled = false;
    const timer = setTimeout(() => {
      if (!settled) setCloud("offline");
    }, 10000);
    db.collection("progress").onSnapshot(
      (snapshot) => {
        if (!snapshot.metadata.fromCache) {
          settled = true;
          clearTimeout(timer);
        }
        applyCloudSnapshot(snapshot);
      },
      () => {
        settled = true;
        clearTimeout(timer);
        db = null;
        setCloud("offline");
      },
    );
  }

  // ---------- Grading by Claude ----------
  const GRADING_OFF = new Set(["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"]);

  function gradingPrompt(q, answer) {
    return `You are a senior React interviewer grading a candidate's answer to one interview question.

Grade against the reference notes, but accept correct points that are phrased differently or go beyond the notes.
Do not penalize grammar, the language of the answer (Serbian or English are both fine), or a missing code sample unless the question asks for code.
Scoring, 0-10:
- 9-10: complete and precise, would impress an interviewer
- 7-8: the core idea is correct, only minor gaps (this is a pass)
- 4-6: partly right, a key point is missing or vague
- 0-3: wrong, off-topic, or empty
Write every piece of feedback in the same language as the candidate's answer. Keep each list item under 25 words.

QUESTION #${q.id}: ${q.question}

REFERENCE NOTES (markdown):
<<<
${q.answer}
>>>

CANDIDATE ANSWER:
<<<
${answer}
>>>

Reply with only this JSON object:
{"score": 7, "verdict": "one sentence overall judgement", "correct": ["point the candidate got right"], "missing": ["key point that was missing"], "wrong": ["statement that was incorrect"], "tip": "one sentence on how to answer next time"}`;
  }

  function listOfStrings(value) {
    return Array.isArray(value) ? value.filter((v) => typeof v === "string" && v.trim()).slice(0, 6).map((v) => v.trim()) : [];
  }
  function normalizeGrade(raw, answer) {
    const score = Math.round(Number(raw?.score));
    if (!Number.isFinite(score)) throw { code: "invalid_json" };
    return {
      score: Math.min(10, Math.max(0, score)),
      verdict: typeof raw.verdict === "string" ? raw.verdict.trim() : "",
      correct: listOfStrings(raw.correct),
      missing: listOfStrings(raw.missing),
      wrong: listOfStrings(raw.wrong),
      tip: typeof raw.tip === "string" ? raw.tip.trim() : "",
      answer,
      gradedAt: Date.now(),
    };
  }
  function gradeErrorText(error) {
    switch (error?.code) {
      case "rate_limited":
        return "Too many grading requests right now. Wait a minute, then grade again.";
      case "session_expired":
        return "Your claude.ai session expired. Sign in again, then grade.";
      case "refused":
        return "Claude declined to grade this answer. Rephrase it and try again.";
      case "prompt_too_large":
        return "The answer is too long to grade. Shorten it and try again.";
      default:
        return GRADING_OFF.has(error?.code)
          ? "Grading is turned off for this page. Your answer is saved; compare it with more-info and grade yourself."
          : "The grade did not come back in a usable form. Grade again.";
    }
  }

  function answerText() {
    return ($("#answer-input")?.value || "").trim();
  }

  async function submitAnswer() {
    const q = currentQuestion();
    if (!q || state.grading) return;
    const text = answerText();
    if (!text) {
      state.gradeError = "Write an answer first.";
      refreshEditorBar();
      return;
    }
    if (!state.canGrade) {
      await saveRecord(q.id, { answer: text });
      clearDraft(q.id);
      state.answering = false;
      state.revealed = true;
      renderQuiz();
      return;
    }

    const controller = new AbortController();
    state.grading = controller;
    state.gradeError = "";
    renderQuiz();
    try {
      const raw = await sample.json(gradingPrompt(q, text), { signal: controller.signal });
      const grade = normalizeGrade(raw, text);
      clearDraft(q.id);
      state.answering = false;
      state.revealed = true;
      await saveRecord(q.id, { answer: text, grade, status: grade.score >= PASS_SCORE ? "known" : "review" });
    } catch (error) {
      if (error?.code !== "cancelled") state.gradeError = gradeErrorText(error);
      if (GRADING_OFF.has(error?.code)) state.canGrade = false;
    } finally {
      if (state.grading === controller) {
        state.grading = null;
        if (currentQuestion()?.id === q.id) renderQuiz();
      }
    }
  }

  // ---------- Drafts ----------
  let draftTimer;
  function storeDraft(id, text) {
    state.drafts[id] = text;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => saveJSON(LS.drafts, state.drafts), 400);
  }
  function clearDraft(id) {
    delete state.drafts[id];
    saveJSON(LS.drafts, state.drafts);
  }

  // ---------- Header + sidebar ----------
  function renderStats() {
    const total = QUESTIONS.length;
    const known = QUESTIONS.filter((q) => statusOf(q.id) === "known").length;
    const review = QUESTIONS.filter((q) => statusOf(q.id) === "review").length;
    const graded = QUESTIONS.map((q) => record(q.id).grade).filter(Boolean);
    const passed = graded.filter((g) => g.score >= PASS_SCORE).length;

    $("#progress-bar").innerHTML =
      `<i class="known" style="width:${(known / total) * 100}%"></i>` +
      `<i class="review" style="width:${(review / total) * 100}%"></i>`;
    $("#stats").innerHTML =
      `<span><span class="sw" style="background:var(--pass)"></span>Known <b>${known}</b></span>` +
      `<span><span class="sw" style="background:var(--retry)"></span>To review <b>${review}</b></span>` +
      `<span><span class="sw" style="background:var(--line)"></span>Not seen <b>${total - known - review}</b></span>` +
      `<span>Graded by Claude <b>${graded.length}</b>${graded.length ? ` · passed <b>${passed}</b>` : ""}</span>`;
  }

  function renderMap() {
    const inDeck = new Set(state.deck.map((q) => q.id));
    const current = currentQuestion()?.id;
    $("#map").innerHTML = SECTIONS.map((section) => {
      const cells = QUESTIONS.filter((q) => q.section === section)
        .map((q) => {
          const dim = state.mode === "quiz" ? !inDeck.has(q.id) : !matchesFilters(q);
          const status = statusOf(q.id);
          return `<button type="button" class="cell${dim ? " dim" : ""}" data-jump="${q.id}" data-status="${status}"
            aria-current="${q.id === current}" aria-label="Question ${q.id}, ${status === "new" ? "not seen" : status}">${q.id}</button>`;
        })
        .join("");
      return `<div><p class="map-title">${sectionLabel(section)}</p><div class="map-grid">${cells}</div></div>`;
    }).join("");
  }

  function renderControls() {
    document.querySelectorAll(".seg button").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.mode === state.mode));
    });
    $("#section-select").value = state.section;
    $("#filter-select").value = state.filter;
    $("#shuffle").checked = state.shuffle;
    $("#shuffle-wrap").hidden = state.mode !== "quiz";
    $("#search-field").hidden = state.mode !== "browse";
  }

  // Updates that must not wipe what the user is typing: stats, map, status markers.
  function refreshPassive() {
    renderStats();
    renderMap();
    const q = currentQuestion();
    const pill = $("#status-pill");
    if (q && pill) {
      const status = statusOf(q.id);
      pill.dataset.status = status;
      pill.textContent = statusLabel(status);
    }
    document.querySelectorAll(".item").forEach((item) => {
      item.dataset.status = statusOf(Number(item.dataset.id));
    });
  }

  function statusLabel(status) {
    return status === "new" ? "not seen" : status === "known" ? "known" : "to review";
  }

  // ---------- Quiz view ----------
  function selfGradeButtons(id) {
    const current = statusOf(id);
    return `
      <div class="self-grade">
        <span class="label">Your call</span>
        <button type="button" data-grade="known" data-id="${id}" aria-pressed="${current === "known"}">✓ I knew it <kbd>1</kbd></button>
        <button type="button" data-grade="review" data-id="${id}" aria-pressed="${current === "review"}">↻ Review again <kbd>2</kbd></button>
      </div>`;
  }

  function editorBarHtml() {
    const busy = Boolean(state.grading);
    let main;
    if (busy) main = `<button type="button" class="btn danger" data-action="stop-grade">Stop grading</button>`;
    else if (state.canGrade) main = `<button type="button" class="btn primary" data-action="submit">Grade my answer</button>`;
    else main = `<button type="button" class="btn primary" data-action="submit">Save answer</button>`;
    const shortcut = state.canGrade ? "grade" : "save";
    return `${main}
      <button type="button" class="btn" data-action="cancel-answer" ${busy ? "disabled" : ""}>Cancel</button>
      <span class="hint-inline"><kbd>⌘ Enter</kbd> to ${shortcut}</span>`;
  }
  function statusLineHtml() {
    if (state.grading) return `<p class="status-line" id="grade-status" role="status">Claude is grading… The first grade asks you to allow Claude for this page.</p>`;
    if (state.gradeError) return `<p class="status-line error" id="grade-status" role="status">${escapeHtml(state.gradeError)}</p>`;
    if (state.canGrade === false)
      return `<p class="status-line" id="grade-status" role="status">Claude grades answers in the claude.ai version of this quiz. Here your answer is saved in this browser.</p>`;
    return `<p class="status-line" id="grade-status" role="status"></p>`;
  }
  function refreshEditorBar() {
    const bar = $(".editor-bar");
    const status = $("#grade-status");
    if (bar) bar.innerHTML = editorBarHtml();
    if (status) status.outerHTML = statusLineHtml();
  }
  function refreshGradeUi() {
    if (state.mode === "quiz" && state.answering) refreshEditorBar();
  }

  function editorHtml(q) {
    const draft = state.drafts[q.id] ?? record(q.id).answer ?? "";
    return `
      <div class="editor">
        <label class="label" for="answer-input">Your answer</label>
        <textarea id="answer-input" data-id="${q.id}" placeholder="Answer as you would in the interview: what it is, why it exists, how it works. Serbian or English."
          ${state.grading ? "disabled" : ""}>${escapeHtml(draft)}</textarea>
        <div class="editor-bar">${editorBarHtml()}</div>
        ${statusLineHtml()}
      </div>`;
  }

  function feedbackList(title, items) {
    if (!items?.length) return "";
    return `<div><p class="label">${title}</p><ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul></div>`;
  }
  function resultHtml(grade) {
    const passed = grade.score >= PASS_SCORE;
    return `
      <section class="result${passed ? " pass" : ""}" aria-label="Claude's grade">
        <div class="result-head">
          <div class="score">${grade.score}<span>/10</span></div>
          <div>
            <span class="verdict-pill">${passed ? "Passed" : "Not yet"}</span>
            ${grade.verdict ? `<p class="verdict">${escapeHtml(grade.verdict)}</p>` : ""}
          </div>
        </div>
        <div>
          <div class="meter"><i style="width:${grade.score * 10}%"></i><b style="left:${PASS_SCORE * 10}%"></b></div>
          <div class="meter-legend"><span>0</span><span>pass at ${PASS_SCORE}</span><span>10</span></div>
        </div>
        <div class="feedback">
          ${feedbackList("What you got right", grade.correct)}
          ${feedbackList("What was missing", grade.missing)}
          ${feedbackList("What was wrong", grade.wrong)}
        </div>
        ${grade.tip ? `<p class="tip"><span class="label">Next time</span><br>${escapeHtml(grade.tip)}</p>` : ""}
        <details class="your-answer"><summary>Your graded answer</summary><p>${escapeHtml(grade.answer || "")}</p></details>
      </section>`;
  }

  function renderQuiz() {
    const { deck, index } = state;
    if (deck.length === 0) {
      view.innerHTML = `<div class="card"><p class="empty">No questions match these filters. Change the section or status on the left.</p></div>`;
      renderMap();
      return;
    }
    if (index >= deck.length) {
      renderDone();
      renderMap();
      return;
    }

    const q = deck[index];
    const rec = record(q.id);
    const status = statusOf(q.id);
    view.innerHTML = `
      <article class="card" aria-labelledby="q-title">
        <div class="card-meta">
          <span class="chip">${sectionLabel(q.section)}</span>
          <span class="count">${index + 1} / ${deck.length}</span>
        </div>
        <h2 class="question" id="q-title"><span class="qnum">${q.id}.</span> ${renderInline(q.question)}</h2>
        <div class="actions">
          ${state.answering ? "" : `<button type="button" class="btn primary" data-action="answer">${rec.answer ? "Answer again" : "Answer"} <kbd>A</kbd></button>`}
          <button type="button" class="btn ghost" data-action="reveal" aria-expanded="${state.revealed}">
            ${state.revealed ? "Hide more-info" : "more-info"} <kbd>Space</kbd>
          </button>
        </div>
        ${state.answering ? editorHtml(q) : ""}
        ${!state.answering && rec.grade ? resultHtml(rec.grade) : ""}
        ${!state.answering && !rec.grade && rec.answer ? `<div class="editor"><p class="label">Your saved answer</p><p class="your-answer" style="white-space:pre-wrap;margin:0">${escapeHtml(rec.answer)}</p></div>` : ""}
        ${state.revealed
          ? `<section class="reference"><p class="label">Reference answer</p><div class="answer">${renderAnswer(q)}</div>${selfGradeButtons(q.id)}</section>`
          : ""}
      </article>
      <nav class="quiz-nav" aria-label="Question navigation">
        <button type="button" data-action="prev" ${index === 0 ? "disabled" : ""}>← Previous</button>
        <span class="pill" id="status-pill" data-status="${status}">${statusLabel(status)}</span>
        <button type="button" data-action="next">${index === deck.length - 1 ? "Finish round" : "Next →"}</button>
      </nav>`;
    highlightIn(view);
    renderMap();
    savePrefs();
  }

  function renderDone() {
    const ids = state.deck.map((q) => q.id);
    const known = ids.filter((id) => statusOf(id) === "known").length;
    const review = ids.filter((id) => statusOf(id) === "review").length;
    view.innerHTML = `
      <div class="card done">
        <h2>Round finished</h2>
        <p>${ids.length} ${ids.length === 1 ? "question" : "questions"} · <b style="color:var(--pass)">${known} known</b> · <b style="color:var(--retry)">${review} to review</b></p>
        <div class="actions">
          ${review > 0 ? `<button type="button" class="btn primary" data-action="drill-review">Drill the ${review} to review</button>` : ""}
          <button type="button" class="btn ghost" data-action="restart">Start this round again</button>
        </div>
      </div>`;
  }

  function goTo(index) {
    resetCard();
    state.index = Math.max(0, Math.min(index, state.deck.length));
    renderQuiz();
    window.scrollTo({ top: 0 });
  }

  function openEditor() {
    if (!currentQuestion()) return;
    state.answering = true;
    state.gradeError = "";
    renderQuiz();
    const input = $("#answer-input");
    if (input) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }

  // ---------- Browse view ----------
  function renderBrowse() {
    const term = state.search.trim().toLowerCase();
    const visible = QUESTIONS.filter(
      (q) => matchesFilters(q) && (!term || `${q.question}\n${q.answer}`.toLowerCase().includes(term)),
    );
    renderMap();
    if (visible.length === 0) {
      view.innerHTML = `<p class="empty">No questions match. Clear the search or change the filters.</p>`;
      return;
    }
    view.innerHTML = SECTIONS.map((section) => [section, visible.filter((q) => q.section === section)])
      .filter(([, items]) => items.length > 0)
      .map(([section, items]) => `
        <section class="group">
          <h2>${sectionLabel(section)}</h2>
          <ol class="list">${items.map(browseItem).join("")}</ol>
        </section>`)
      .join("");
    highlightIn(view);
  }

  function browseItem(q) {
    const isOpen = state.open.has(q.id);
    const grade = record(q.id).grade;
    const badge = grade
      ? `<span class="score-badge${grade.score >= PASS_SCORE ? " pass" : ""}">${grade.score}/10</span>`
      : "";
    return `
      <li class="item" id="q-${q.id}" data-id="${q.id}" data-status="${statusOf(q.id)}">
        <div class="item-head">
          <span class="qnum">${q.id}.</span>
          <span class="item-q">${renderInline(q.question)}</span>
          ${badge}
          <span class="dot" aria-hidden="true"></span>
        </div>
        <button type="button" class="btn ghost" data-action="toggle" data-id="${q.id}" aria-expanded="${isOpen}">
          ${isOpen ? "Hide more-info" : "more-info"}
        </button>
        ${isOpen ? `<div class="answer">${renderAnswer(q)}</div>${selfGradeButtons(q.id)}` : ""}
      </li>`;
  }

  // Map cells and in-answer links ("#50-where-does-react-store-state…") both land here.
  function jumpToQuestion(id) {
    if (!BY_ID.has(id)) return;
    if (state.mode === "quiz") {
      let deckIndex = state.deck.findIndex((q) => q.id === id);
      if (deckIndex === -1) {
        state.section = "all";
        state.filter = "all";
        restartDeck();
        renderControls();
        deckIndex = state.deck.findIndex((q) => q.id === id);
      }
      goTo(deckIndex);
      return;
    }
    if (!matchesFilters(BY_ID.get(id))) {
      state.section = "all";
      state.filter = "all";
      restartDeck();
    }
    state.search = "";
    $("#search").value = "";
    state.open.add(id);
    savePrefs();
    render();
    const item = document.getElementById(`q-${id}`);
    item.scrollIntoView({ behavior: "smooth", block: "center" });
    item.classList.add("flash");
    setTimeout(() => item.classList.remove("flash"), 1500);
  }

  // ---------- Render + events ----------
  function render() {
    renderControls();
    renderStats();
    if (state.mode === "quiz") renderQuiz();
    else renderBrowse();
  }

  function handleClick(event) {
    const link = event.target.closest('a[href^="#"]');
    if (link) {
      const match = link.getAttribute("href").match(/^#(\d+)-/);
      if (match) {
        event.preventDefault();
        jumpToQuestion(Number(match[1]));
      }
      return;
    }

    const button = event.target.closest("button");
    if (!button) return;

    if (button.dataset.jump) {
      jumpToQuestion(Number(button.dataset.jump));
      return;
    }

    if (button.dataset.grade) {
      const id = Number(button.dataset.id);
      saveRecord(id, { status: button.dataset.grade });
      if (state.mode === "quiz") {
        goTo(state.index + 1);
      } else {
        button.parentElement.querySelectorAll("[data-grade]").forEach((b) => {
          b.setAttribute("aria-pressed", String(b === button));
        });
      }
      return;
    }

    switch (button.dataset.action) {
      case "answer":
        openEditor();
        break;
      case "submit":
        submitAnswer();
        break;
      case "stop-grade":
        state.grading?.abort();
        break;
      case "cancel-answer":
        state.answering = false;
        state.gradeError = "";
        renderQuiz();
        break;
      case "reveal":
        state.revealed = !state.revealed;
        renderQuiz();
        break;
      case "prev":
        goTo(state.index - 1);
        break;
      case "next":
        goTo(state.index + 1);
        break;
      case "restart":
        restartDeck();
        renderQuiz();
        break;
      case "drill-review":
        state.filter = "review";
        restartDeck();
        render();
        break;
      case "toggle": {
        const id = Number(button.dataset.id);
        if (state.open.has(id)) state.open.delete(id);
        else state.open.add(id);
        document.getElementById(`q-${id}`).outerHTML = browseItem(BY_ID.get(id));
        highlightIn(document.getElementById(`q-${id}`));
        break;
      }
    }
  }
  view.addEventListener("click", handleClick);
  $("#map").addEventListener("click", handleClick);

  view.addEventListener("input", (event) => {
    if (event.target.id === "answer-input") storeDraft(event.target.dataset.id, event.target.value);
  });

  document.querySelectorAll(".seg button").forEach((button) => {
    button.addEventListener("click", () => {
      resetCard();
      state.mode = button.dataset.mode;
      savePrefs();
      render();
    });
  });

  function onFilterChange() {
    restartDeck();
    savePrefs();
    render();
  }
  $("#section-select").addEventListener("change", (event) => {
    state.section = event.target.value;
    onFilterChange();
  });
  $("#filter-select").addEventListener("change", (event) => {
    state.filter = event.target.value;
    onFilterChange();
  });
  $("#shuffle").addEventListener("change", (event) => {
    state.shuffle = event.target.checked;
    onFilterChange();
  });
  $("#search").addEventListener("input", (event) => {
    state.search = event.target.value;
    renderBrowse();
  });

  // Two-step reset: confirm() does not exist inside claude.ai artifacts.
  let resetArmedUntil = 0;
  $("#reset").addEventListener("click", async (event) => {
    const button = event.currentTarget;
    if (Date.now() > resetArmedUntil) {
      resetArmedUntil = Date.now() + 4000;
      button.textContent = "Click again to erase all answers";
      button.classList.add("armed");
      setTimeout(() => {
        button.textContent = "Reset progress";
        button.classList.remove("armed");
      }, 4000);
      return;
    }
    resetArmedUntil = 0;
    button.textContent = "Reset progress";
    button.classList.remove("armed");
    const ids = Object.keys(state.records);
    state.records = {};
    state.drafts = {};
    saveJSON(LS.records, {});
    saveJSON(LS.drafts, {});
    restartDeck();
    render();
    if (db && state.cloud !== "readonly") {
      for (const id of ids) {
        await db.doc(`progress/q-${id}`).delete().catch(handleWriteError);
      }
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.target.id === "answer-input") {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault();
        submitAnswer();
      } else if (event.key === "Escape") {
        event.target.blur();
      }
      return;
    }
    if (state.mode !== "quiz" || event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.target.closest("input, select, textarea")) return;
    // A focused button already handles Space/Enter natively.
    if (event.target.closest("button") && (event.key === " " || event.key === "Enter")) return;

    const q = currentQuestion();
    if (event.key === " " && q) {
      event.preventDefault();
      state.revealed = !state.revealed;
      renderQuiz();
    } else if ((event.key === "a" || event.key === "A") && q && !state.answering) {
      event.preventDefault();
      openEditor();
    } else if (event.key === "ArrowRight") {
      goTo(state.index + 1);
    } else if (event.key === "ArrowLeft") {
      goTo(state.index - 1);
    } else if ((event.key === "1" || event.key === "2") && q && (state.revealed || record(q.id).grade)) {
      saveRecord(q.id, { status: event.key === "1" ? "known" : "review" });
      goTo(state.index + 1);
    }
  });

  // ---------- Init ----------
  $("#section-select").innerHTML =
    `<option value="all">All sections</option>` +
    SECTIONS.map((s) => {
      const { folder, name } = splitSection(s);
      return `<option value="${escapeHtml(s)}">${escapeHtml(folder ? `${folder} · ${name}` : name)}</option>`;
    }).join("");

  if (matchMedia("(max-width: 1023px)").matches) $("#map-wrap").open = false;

  state.deck = buildDeck();
  const resumeIndex = state.deck.findIndex((q) => q.id === prefs.lastId);
  state.index = resumeIndex === -1 ? 0 : resumeIndex;
  render();
  connectClaude();
</script>
