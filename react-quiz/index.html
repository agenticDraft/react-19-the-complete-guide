<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>React Interview Quiz</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚛️%3C/text%3E%3C/svg%3E" />
  <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L" crossorigin="anonymous" />
  <link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous" disabled />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"
    integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
    integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --text: #1b1f24;
      --muted: #5c6670;
      --border: #dde1e6;
      --accent: #087ea4;
      --accent-soft: #e6f4f8;
      --known: #1a7f37;
      --known-soft: #e3f4e8;
      --review: #b35900;
      --review-soft: #fdf0e1;
      --code-bg: #f6f8fa;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 4px 16px rgba(16, 24, 40, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1216;
        --surface: #171b21;
        --surface-2: #1f242c;
        --text: #e6e9ed;
        --muted: #9aa4af;
        --border: #2b323b;
        --accent: #58c4dc;
        --accent-soft: #15303a;
        --known: #4ac26b;
        --known-soft: #16301f;
        --review: #f0a54a;
        --review-soft: #352614;
        --code-bg: #0d1117;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f1216;
      --surface: #171b21;
      --surface-2: #1f242c;
      --text: #e6e9ed;
      --muted: #9aa4af;
      --border: #2b323b;
      --accent: #58c4dc;
      --accent-soft: #15303a;
      --known: #4ac26b;
      --known-soft: #16301f;
      --review: #f0a54a;
      --review-soft: #352614;
      --code-bg: #0d1117;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    kbd {
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 4px;
      background: var(--surface-2);
    }

    .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

    /* Header + progress */
    header.top {
      position: sticky;
      top: 0;
      z-index: 5;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .top-row { display: flex; align-items: center; gap: 12px; padding: 12px 0 8px; }
    .top-row h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: -0.01em; }
    .top-row h1 span { color: var(--accent); }
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 14px;
    }
    .progress { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
    .progress .known { background: var(--known); }
    .progress .review { background: var(--review); }
    .stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); padding: 6px 0 10px; }
    .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
    .stats .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

    /* Controls */
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; padding: 3px; background: var(--surface); }
    .seg button { border: 0; background: none; padding: 5px 14px; border-radius: 7px; font-size: 14px; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    :root[data-theme="dark"] .seg button[aria-pressed="true"] { color: #062029; }
    select, input[type="search"] {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 14px;
      min-width: 0;
      max-width: 100%;
    }
    input[type="search"] { flex: 1 1 200px; }
    .check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
    .spacer { flex: 1; }
    .link-btn { border: 0; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 4px; }

    /* Quiz card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 24px;
    }
    .card-meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
    .chip { background: var(--accent-soft); color: var(--accent); padding: 2px 10px; border-radius: 99px; font-weight: 600; }
    .question { font-size: 22px; line-height: 1.35; margin: 16px 0 20px; letter-spacing: -0.01em; }
    .qnum { color: var(--muted); font-weight: 500; margin-right: 6px; }
    .reveal {
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 10px;
      padding: 8px 18px;
      font-weight: 600;
    }
    .reveal.small { padding: 4px 12px; font-size: 13px; }
    .grade { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--border); }
    .grade button { border-radius: 10px; padding: 8px 14px; font-weight: 600; border: 1px solid; display: inline-flex; gap: 8px; align-items: center; }
    .grade [data-grade="known"] { color: var(--known); background: var(--known-soft); border-color: var(--known); }
    .grade [data-grade="review"] { color: var(--review); background: var(--review-soft); border-color: var(--review); }
    .grade button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px currentColor; }

    .quiz-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0; }
    .quiz-nav button { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 6px 14px; }
    .quiz-nav button:disabled { opacity: 0.4; cursor: default; }
    .hint { text-align: center; font-size: 12px; color: var(--muted); margin: 0 0 32px; }

    .pill { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
    .pill[data-status="known"] { background: var(--known-soft); color: var(--known); }
    .pill[data-status="review"] { background: var(--review-soft); color: var(--review); }

    /* Answer markdown */
    .answer { margin-top: 20px; overflow-wrap: anywhere; }
    .answer > :first-child { margin-top: 0; }
    .answer p, .answer ul, .answer ol { margin: 0 0 12px; }
    .answer ul, .answer ol { padding-left: 22px; }
    .answer li { margin: 4px 0; }
    .answer code {
      font: 0.88em ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--surface-2);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .answer pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 0 0 14px;
      font-size: 13px;
      line-height: 1.5;
    }
    .answer pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
    .answer pre code.hljs { background: none; padding: 0; }
    .answer blockquote {
      margin: 0 0 12px;
      padding: 8px 14px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 0 8px 8px 0;
    }
    .answer blockquote p { margin: 0; }
    .answer a { color: var(--accent); }

    /* Done screen */
    .done { text-align: center; }
    .done h2 { margin: 0 0 8px; }
    .done p { color: var(--muted); }
    .done .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }

    /* Browse list */
    .group h2 { font-size: 15px; color: var(--muted); margin: 28px 0 10px; text-transform: uppercase; letter-spacing: 0.04em; }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
    .item-head { display: flex; gap: 10px; align-items: flex-start; }
    .item-q { flex: 1; font-weight: 600; }
    .item .reveal { margin-top: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 8px; background: var(--border); flex: none; }
    .item[data-status="known"] .dot { background: var(--known); }
    .item[data-status="review"] .dot { background: var(--review); }
    .item.flash { outline: 2px solid var(--accent); }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }

    @media (max-width: 560px) {
      .card { padding: 18px; border-radius: 12px; }
      .question { font-size: 19px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="top-row">
        <h1>React 19 <span>Interview Quiz</span></h1>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
      </div>
      <div class="progress" id="progress-bar"></div>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <main class="wrap">
    <div class="controls">
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" data-mode="quiz">Quiz</button>
        <button type="button" data-mode="browse">Browse</button>
      </div>
      <select id="section-select" aria-label="Section"></select>
      <select id="filter-select" aria-label="Filter by status">
        <option value="all">All questions</option>
        <option value="new">Not seen yet</option>
        <option value="review">To review</option>
        <option value="known">Known</option>
      </select>
      <label class="check" id="shuffle-wrap"><input type="checkbox" id="shuffle" /> Shuffle</label>
      <input type="search" id="search" placeholder="Search questions and answers…" />
      <span class="spacer"></span>
      <button class="link-btn" type="button" id="reset">Reset progress</button>
    </div>

    <div id="view"></div>
  </main>

  <script>
    const QUESTIONS = [{"id":1,"section":"Section 01 — React Essentials","question":"What is a React component and what does React do with it?","answer":"**What:** a component is a plain JavaScript function whose name starts with an uppercase letter\nand which returns JSX.\n\n**How it works:** React does not \"run your page\". It *calls your function* and gets back a\ndescription of the UI (JSX compiles to `jsx(\"h1\", {...})` objects). React compares that\ndescription with what is on screen and only touches the DOM where something differs.\nEvery time the component's state (or its parent) changes, React calls the function **again** —\nthat is a *render*.\n\n**Why uppercase:** React uses the first letter to tell a component (`\u003cHeader />` → call the\n`Header` function) from a built-in element (`\u003cheader>` → create a DOM `\u003cheader>` tag).\n\n```jsx\n// section-01-starting-project/src/App.jsx\nfunction App() {\n  console.log(`App component is rendered!`); // runs on every render\n  return (\n    \u003c>\n      \u003cHeader />\n      \u003cmain>\n        \u003cCoreConcepts />\n        \u003cExamples />\n      \u003c/main>\n    \u003c/>\n  );\n}\n```\n\n`\u003c>...\u003c/>` is a **Fragment**: a wrapper that satisfies \"return one root element\" without adding\nan extra `\u003cdiv>` to the DOM."},{"id":2,"section":"Section 01 — React Essentials","question":"What is a Hook? What is the rule for using it?","answer":"**What:** every function whose name starts with `use` (`useState`, `useRef`, `useEffect`, …)\nis a Hook — a special function that lets a component \"hook into\" React features\n(state, lifecycle, context).\n\n**Rules of Hooks:**\n\n1. Call them only at the **top level** of a component or a custom Hook — never inside `if`,\n   loops, nested functions or event handlers.\n2. Call them only from React function components or other Hooks.\n\n**Why:** React does not know your Hooks by name. It remembers them **by call order**\n(1st Hook, 2nd Hook, …). If an `if` skips one Hook on some render, every Hook after it gets the\nwrong stored value.\n\n> The one exception is `use` from React 19 — see question [38](#38-what-is-the-use-api-in-react-19-and-why-is-it-allowed-inside-if)."},{"id":3,"section":"Section 01 — React Essentials","question":"What is `useState` and how does it work?","answer":"**What:** a Hook that gives a component memory that survives re-renders.\n\n```jsx\n// section-01-starting-project/src/components/Examples/Examples.jsx:8\nconst [selectedTab, setSelectedTab] = useState();\n```\n\nIt returns an array with two elements:\n\n- `selectedTab` — the current value for **this** render,\n- `setSelectedTab` — a function that *schedules* a new value and asks React to re-render.\n\n**How:** React stores the value outside your function (see question [50](#50-where-does-react-store-state-and-what-does-key-have-to-do-with-it)). On the\nfirst render it uses the argument you passed (`undefined` here); on every later render it ignores\nthe argument and hands back what it stored.\n\n**Why not a normal variable:** `let selectedTab` would be re-created on every call of\n`Examples()` and changing it would not trigger a re-render, so the screen would never update."},{"id":4,"section":"Section 01 — React Essentials","question":"To run code when an event happens, which value must be passed to an event prop like `onClick`?","answer":"**A function reference** (a pointer to the function), **not** the result of calling it.\n\n```jsx\n\u003cbutton onClick={handleClick}>   // ✅ React calls it later, on click\n\u003cbutton onClick={handleClick()}> // ❌ runs immediately during render\n```\n\n**Why:** JSX is evaluated during render. `handleClick()` would execute while React is building\nthe UI and pass its *return value* (usually `undefined`) to `onClick`."},{"id":5,"section":"Section 01 — React Essentials","question":"How do you \"configure\" an event handler — for example, pass it your own arguments?","answer":"Wrap the call in an **arrow function**. The arrow function is the reference React stores; your\nreal function is only called inside it, when the click happens.\n\n```jsx\n// section-01-starting-project/src/components/Examples/Examples.jsx:40\n\u003cTabButton\n  isSelected={selectedTab === \"components\"}\n  onClick={() => handleTabSelect(\"components\")}\n>\n  Components\n\u003c/TabButton>\n```\n\nSame pattern with several arguments:\n\n```jsx\n// section-04-tic-tac-toe-starting-project/src/Components/GameBoard/GameBoard.jsx:38\nonClick={() => onSelectSquare(rowIndex, colIndex)}\n```"},{"id":6,"section":"Section 01 — React Essentials","question":"What is `children` and what is a \"slot\"?","answer":"**`children`** is a special prop: whatever you put *between* a component's opening and closing\ntags.\n\n**A slot** is the same idea, but through a named prop — so one component can receive several\nseparate blocks of JSX.\n\n```jsx\n// section-01-starting-project/src/components/Tabs/Tabs.jsx\nexport default function Tabs({ children, buttons, ButtonsContainer = \"menu\" }) {\n  // buttons are a SLOT, they come from Examples.jsx\n  return (\n    \u003c>\n      \u003cButtonsContainer>{buttons}\u003c/ButtonsContainer>\n      {children}\n    \u003c/>\n  );\n}\n```\n\nIn `Examples.jsx` the `buttons` prop receives a Fragment with four `\u003cTabButton>`s, and\n`{tabContent}` between `\u003cTabs>…\u003c/Tabs>` becomes `children`.\n\n**Why:** the layout (where buttons go, where content goes) lives in `Tabs`; the content lives\nin the caller. `Tabs` can be reused for any set of tabs."},{"id":7,"section":"Section 01 — React Essentials","question":"How do you pass a component (or an HTML tag) as a prop? Why must the prop name be capitalized?","answer":"```jsx\n// section-01-starting-project/src/components/Examples/Examples.jsx:35\n\u003cTabs ButtonsContainer=\"menu\" buttons={...}>\n```\n\n```jsx\n// Tabs.jsx\n\u003cButtonsContainer>{buttons}\u003c/ButtonsContainer>\n```\n\n- **Built-in element** → pass its name as a string: `\"menu\"`, `\"div\"`, `\"ul\"`.\n- **Custom component** → pass the function itself: `ButtonsContainer={MyButtonContainer}`.\n\n**Why UpperCamelCase:** inside `Tabs`, JSX `\u003cButtonsContainer>` is compiled to\n`jsx(ButtonsContainer, …)` — a variable lookup. With a lowercase name `\u003cbuttonsContainer>` JSX\nwould compile to the *string* `\"buttonsContainer\"` and React would try to create an unknown\nHTML tag.\n\nThe same trick appears in section 12:\n\n```jsx\n// section-12-optimization/src/components/UI/IconButton.jsx:7\nconst Icon = icon;          // rename lowercase prop to an uppercase variable\n\u003cIcon className=\"button-icon\" />\n```"},{"id":8,"section":"Section 01 — React Essentials","question":"What does `...forwardedProps` (rest/spread props) do and why is it useful?","answer":"**What:** in the parameter list, `...forwardedProps` (rest) collects *every prop you did not\nname*. In JSX, `{...forwardedProps}` (spread) puts them all back onto an element.\n\n```jsx\n// section-01-starting-project/src/components/Section.jsx\nexport default function Section({ title, children, ...forwardedProps }) {\n  return (\n    \u003csection {...forwardedProps}>\n      \u003ch2>{title}\u003c/h2>\n      {children}\n    \u003c/section>\n  );\n}\n\n// Examples.jsx — id and className land in forwardedProps\n\u003cSection title=\"Examples\" id=\"examples\" className=\"examples\">\n```\n\n```text\nprops            = { title, children, id, className }\nforwardedProps   = {                  id, className }  → spread onto \u003csection>\n```\n\n**Why:** the wrapper component does not have to list every possible HTML attribute\n(`id`, `className`, `onClick`, `aria-*` …). It stays flexible and reusable.\n`TabButton.jsx` uses the same trick to forward `onClick` from `Examples.jsx` to the real\n`\u003cbutton>`."},{"id":9,"section":"Section 01 — React Essentials","question":"How do you render a list, and why does each item need a `key`?","answer":"Use `.map()` to turn an array of data into an array of JSX elements:\n\n```jsx\n// section-01-starting-project/src/components/CoreConcepts/CoreConcepts.jsx:9\n{CORE_CONCEPTS_ARRAY.map((conceptItem) => (\n  \u003cCoreConcept key={conceptItem.title} {...conceptItem} />\n))}\n```\n\n`{...conceptItem}` spreads `title`, `description`, `image` as separate props.\n\n**Why `key`:** React uses the key to recognize the *same* item between renders. Without a stable\nkey it falls back to the position (index); after inserting or removing an item, state ends up\nattached to the wrong element. More in question [51](#51-why-must-list-keys-be-unique-and-stable)."},{"id":10,"section":"Section 01 — React Essentials","question":"How should a React project be structured?","answer":"Split components **by feature**, and keep a component's styles next to it:\n\n```text\nsrc/\n  components/\n    Header/\n      Header.jsx\n      Header.css\n    CoreConcept/\n      CoreConcept.jsx\n      CoreConcept.css\n  store/                ← context + reducers (section 10)\n  util/                 ← pure helpers, no JSX (section 05)\n```\n\n**Why:** one component = one responsibility. Small components are easier to read, reuse and test,\nand — important for performance (section 12) — a state change only re-renders the component that\nowns that state and its children. Keep state as low in the tree as possible."},{"id":11,"section":"Section 04 — Tic-Tac-Toe","question":"Why should you use the function form `setX(prev => …)` when the new state depends on the old one?","answer":"```jsx\n// section-04-tic-tac-toe-starting-project/src/Components/Player/Player.jsx:11\nfunction handleEditClick() {\n  // setIsEditing(!isEditing);           ❌ uses the value from THIS render\n  setIsEditing((editing) => !editing);   // ✅ React passes the latest value\n}\n```\n\n**How it works:** `isEditing` is a plain `const` captured when `Player()` was called.\n`setIsEditing` does not change it — it only *schedules* an update (see question\n[49](#49-why-does-consolelog-right-after-setstate-show-the-old-value)). If two updates are queued\nin the same click, both read the same old `isEditing`:\n\n```text\nisEditing = false\nsetIsEditing(!isEditing)   → queue: \"set true\"\nsetIsEditing(!isEditing)   → queue: \"set true\"      result: true  ❌ (expected false)\n\nsetIsEditing(e => !e)      → queue: \"flip\"\nsetIsEditing(e => !e)      → queue: \"flip\"          result: false ✅\n```\n\n**Rule:** new value depends on the old one → pass a function."},{"id":12,"section":"Section 04 — Tic-Tac-Toe","question":"Why must you never mutate state directly? How do you copy arrays and objects correctly?","answer":"**Why:** React decides whether to re-render by comparing the old and new value with `Object.is`\n(a reference check). If you mutate the existing array, the reference is the same → React thinks\nnothing changed. You also corrupt the \"previous\" value other code may still read.\n\n**Spread copies only one level (shallow copy).** A nested array/object is still shared:\n\n```js\nconst initialGameBoard = [\n  [null, null, null],\n  [null, null, null],\n  [null, null, null],\n];\n\nconst shallow = [...initialGameBoard];          // new outer array, SAME inner rows ❌\nconst board   = initialGameBoard.map((row) => [...row]);   // copies every row ✅\n```\n\n```jsx\n// section-04-tic-tac-toe-starting-project/src/App.jsx:58 — deep copy of an array\nlet gameBoard = [...INITIAL_GAME_BOARD.map((array) => [...array])];\n```\n\n**Nested object** — copy every level you change:\n\n```js\nconst updated = {\n  ...original,\n  address: { ...original.address, city: \"Niš\" },\n};\n```\n\n**`structuredClone()`** (built into the browser) also makes a full deep copy, but it copies\n*everything*, including parts that did not change. React works best when unchanged parts keep their\nreference (`memo` and `useMemo` rely on it), so prefer copying only the path you change."},{"id":13,"section":"Section 04 — Tic-Tac-Toe","question":"What is \"lifting state up\"?","answer":"**What:** when two sibling components need the same data, move the state to their **closest\ncommon parent** and pass it down as props (plus a function to change it).\n\nIn Tic-Tac-Toe, `GameBoard` and `Log` both need the list of turns, so `gameTurns` lives in\n`App`:\n\n```jsx\n// section-04-tic-tac-toe-starting-project/src/App.jsx:74\nconst [gameTurns, setGameTurns] = useState([]);\n...\n\u003cGameBoard onSelectSquare={handleSelectSquareApp} board={gameBoard} />\n\u003cLog turns={gameTurns} />\n```\n\nThe commented-out code in `GameBoard.jsx:2-27` is the \"before\" version — `GameBoard` had its own\n`gameBoard` state, which `Log` could not see. It was moved to `App.jsx`."},{"id":14,"section":"Section 04 — Tic-Tac-Toe","question":"What is derived (computed) state and why prefer it over extra `useState`?","answer":"**What:** a value you can *calculate* from existing state should not have its own state.\nCalculate it during render.\n\n```jsx\n// section-04-tic-tac-toe-starting-project/src/App.jsx:73-82\n// const [activePlayer, setActivePlayer] = useState(\"X\");   ← removed\nconst [gameTurns, setGameTurns] = useState([]);\n\nconst activePlayer = deriveActivePlayer(gameTurns);\nconst gameBoard    = deriveGameBoard(gameTurns);\nconst winner       = deriveWinner(gameBoard, players);\nconst hasDraw      = gameTurns.length === 9 && !winner;\n```\n\n**Why:** one source of truth. With two states (`gameTurns` and `activePlayer`) you must keep them\nin sync manually; one missed `setActivePlayer` and the UI shows a wrong player. A derived value is\nalways correct because it is recomputed on every render (\"App will re-execute after every turn\").\n\n**Bonus — why the helpers live outside `App`:** a function declared outside the component is\ncreated once when the module loads. Inside the component it would be re-created on every render.\nThey also don't need anything from the component scope."},{"id":15,"section":"Section 04 — Tic-Tac-Toe","question":"Why does Player call `onChangeName` only when clicking \"Save\", not on every keystroke?","answer":"```jsx\n// section-04-tic-tac-toe-starting-project/src/Components/Player/Player.jsx:14-19\nsetIsEditing((editing) => !editing);\n\nif (isEditing) {\n  // to not execute on every user stroke\n  onChangeName(symbol, playerName);\n}\n```\n\nThe input updates local state (`playerName`) on every keystroke — that only re-renders `Player`.\nLifting the name to `App` on every key would re-render the whole game. So the name is sent up\nonly once, when the user clicks **Save**.\n\n**Subtle point:** `isEditing` here is still the *old* value (the toggle was only scheduled).\n`true` means \"we were editing, so this click is Save\"."},{"id":16,"section":"Section 04 — Tic-Tac-Toe","question":"How do you update one key of an object in state using a dynamic key?","answer":"Use a **computed property name** `[variable]` inside a new object:\n\n```jsx\n// section-04-tic-tac-toe-starting-project/src/App.jsx:106\nfunction handlePlayersNameChange(symbol, newName) {\n  setPlayers((prevPlayers) => ({\n    ...prevPlayers,       // copy X and O\n    [symbol]: newName,    // overwrite only \"X\" or only \"O\"\n  }));\n}\n```\n\n`[symbol]` means \"use the *value* of `symbol` as the key\", so `symbol = \"O\"` updates `O`.\nWithout brackets the key would literally be `\"symbol\"`."},{"id":17,"section":"Section 05 — Investment Calculator","question":"What type is an input's value, even for `type=\"number\"`? How do you store a number?","answer":"**Always a string.** `event.target.value` comes from the DOM, and DOM input values are strings —\n`type=\"number\"` only affects the on-screen keyboard and validation.\n\n```jsx\n// section-05-essentials-practice-project-1/src/Components/UserInput/UserInput.jsx:18\n\u003cinput\n  type=\"number\"\n  required\n  value={userInput.annualInvestment}\n  onChange={(e) => handleChange(\"annualInvestment\", e.target.value)}\n/>\n```\n\nConvert it with unary `+` before storing:\n\n```jsx\n// section-05-essentials-practice-project-1/src/App.jsx:17\nconst handleChange = (inputIdentifier, newValue) => {\n  setUserInput((prevUserInput) => ({\n    ...prevUserInput,\n    [inputIdentifier]: +newValue,   // \"1200\" → 1200\n  }));\n};\n```\n\n**What breaks without it:** `\"10000\" + 1200` → `\"100001200\"` (string concatenation). The\ncalculator shows absurd numbers, with no error in the console."},{"id":18,"section":"Section 05 — Investment Calculator","question":"What is a controlled input?","answer":"An input whose `value` comes from React state and whose `onChange` updates that state:\n\n```text\nstate ──value──▶ \u003cinput>  ──onChange──▶ setState ──▶ re-render ──▶ new value shown\n```\n\nReact state is the single source of truth. In section 05 the state lives in `App` and\n`UserInput` only receives `userInput` and `handleChange` as props (lifting state up — question\n[13](#13-what-is-lifting-state-up)).\n\nThe opposite — reading the DOM value only when needed — is an **uncontrolled** input, done with a\nref (question [27](#27-what-is-useref-and-why-do-you-always-need-current))."},{"id":19,"section":"Section 05 — Investment Calculator","question":"How do you render something conditionally in JSX?","answer":"```jsx\n// section-05-essentials-practice-project-1/src/App.jsx:29\n{!inputIsValid && \u003cp className=\"error-text center\">Please enter a valid duration\u003c/p>}\n{inputIsValid && \u003cResults userInput={userInput} />}\n```\n\n- `condition && \u003cX />` — renders `\u003cX />` when true, nothing when false.\n- `condition ? \u003cA /> : \u003cB />` — one of two.\n- Or prepare a variable with `if` before `return` (`Examples.jsx:15`, `Player.jsx:22`).\n\n**Gotcha:** `0 && \u003cX />` renders `0` on screen, because `0` is a valid React child. Use\n`count > 0 && …`."},{"id":20,"section":"Section 06 — Styling","question":"How do styled-components work?","answer":"`styled.button` is a function called with a template literal. It returns a **new React component**\nthat renders a `\u003cbutton>` with a generated, unique class name, and injects the CSS into a\n`\u003cstyle>` tag. Styles are scoped automatically — no clashes between components.\n\n```jsx\n// section-06-styled-components/src/components/Header.jsx:5\nconst HeaderStyle = styled.header`\n  display: flex;\n  & img { width: 11rem; }               /* & = this component */\n  @media (min-width: 768px) { margin-bottom: 4rem; }\n`;\n\n\u003cHeaderStyle>...\u003c/HeaderStyle>\n```"},{"id":21,"section":"Section 06 — Styling","question":"What is a transient prop (`$invalid`) in styled-components and why the `$`?","answer":"```jsx\n// section-06-styled-components/src/components/Input.jsx:3\nconst LabelStyle = styled.label`\n  color: ${(props) => (props.$invalid ? \"#f87171\" : \"#6b7280\")};\n`;\n\n\u003cLabelStyle $invalid={invalid}>{label}\u003c/LabelStyle>\n```\n\n**How:** an interpolated function receives the component's props, so CSS can change dynamically.\n\n**Why `$`:** by default styled-components forwards props to the real DOM element. `invalid` would\nend up as `\u003clabel invalid=\"true\">` and React warns about an unknown attribute. Props starting with\n`$` are *transient* — used for styling and never passed to the DOM."},{"id":22,"section":"Section 06 — Styling","question":"How do you apply conditional styles with Tailwind CSS?","answer":"Tailwind is utility-first: you compose small classes (`px-4`, `text-red-500`) directly in\n`className`. Conditional styles = build the class string in JavaScript:\n\n```jsx\n// section-06-tailwindcss/src/components/Input.jsx:2\nlet labelClasses = \"block mb-2 text-xs font-bold tracking-wide uppercase\";\nif (invalid) {\n  labelClasses += \" text-red-500\";\n} else {\n  labelClasses += \" text-gray-500\";\n}\n```\n\n**Gotcha:** always write **full** class names. Tailwind scans source files for complete strings;\n`\"text-\" + color + \"-500\"` is never found, so that CSS is never generated.\n\n**Tailwind v4 note:** this project uses `@import \"tailwindcss\"` (v4). v4 configures the theme in\nCSS (`@theme`) and does **not** load `tailwind.config.js` automatically — it needs\n`@config \"../tailwind.config.js\";` in the CSS file. Without it, the custom `font-title` class from\n`tailwind.config.js` has no effect."},{"id":23,"section":"Section 07 — Debugging","question":"What does `\u003cStrictMode>` do and why does my code run twice?","answer":"**What:** a development-only wrapper that deliberately runs some code **twice** to expose bugs:\n\n- component functions are rendered twice,\n- `useState` / `useMemo` initializers and reducers are called twice,\n- effects run **mount → cleanup → mount**.\n\n**Why:** components must be *pure* (same input → same output, no side effects during render).\nRunning twice makes impure code visible — e.g. pushing into an array that lives outside the\ncomponent doubles every entry.\n\n```jsx\n// section-07-debugging/src/index.jsx\nimport { StrictMode } from \"react\";\n\nReactDOM.createRoot(document.getElementById(\"root\")).render(\n  \u003cStrictMode>\n    \u003cApp />\n  \u003c/StrictMode>,\n);\n```\n\nIn `section-07-debugging/src/components/Results.jsx:4` the `results` array is created **inside**\nthe component, so each (double) render starts from an empty array. Declared at module level, it\nwould collect duplicate rows on every render — exactly what StrictMode reveals.\n\nNothing is doubled in the production build."},{"id":24,"section":"Section 07 — Debugging","question":"Which tools help debug a React app?","answer":"1. **The error overlay / console** — read the message and the file:line it points to.\n2. **Browser DevTools → Sources** — set breakpoints in your `.jsx` (Vite serves source maps)\n   and step through the code.\n3. **React DevTools** (browser extension) — *Components* tab shows the tree, props, state and\n   Hooks of each component; *Profiler* shows what rendered and why.\n4. **`\u003cStrictMode>`** — surfaces impure code early (question [23](#23-what-does-strictmode-do-and-why-does-my-code-run-twice)).\n5. `console.log` in the component body tells you **when** it renders (used heavily in section 12\n   via `log.js`)."},{"id":25,"section":"Section 08 — Refs & Portals","question":"Where do you keep a value like a timer id? Why not in a variable outside or inside the component?","answer":"```jsx\n// section-08-refs-and-portals/src/components/TimerChallenge/TimerChallenge.jsx\n// let timerId;   ❌ outside: shared by ALL TimerChallenge instances\n\nexport default function TimerChallenge({ title, targetTime }) {\n  // let timerId; ❌ inside: re-created (undefined) on every render\n  const timerIdRef = useRef();   // ✅ per instance, survives re-renders\n\n  function handleStart() {\n    timerIdRef.current = setInterval(...);\n  }\n  function handleStop() {\n    clearInterval(timerIdRef.current);\n  }\n```\n\n```text\nmodule variable  → 1 box for all 4 timers   → starting timer #2 overwrites #1's id\nlocal variable   → new empty box every render → after re-render the id is lost\nuseRef           → 1 box per component instance, kept by React across renders ✅\n```\n\n`App.jsx` renders four `\u003cTimerChallenge>`s, so the module variable visibly breaks: stopping one\ntimer stops the wrong interval."},{"id":26,"section":"Section 08 — Refs & Portals","question":"What is the difference between state and a ref?","answer":"- **State** — changing it **re-renders** the component. Use it for anything shown on screen.\n- **Ref** — changing `ref.current` does **not** re-render. Use it for values the UI does not\n  display (timer ids, the selected id in section 11) and for DOM access.\n\nBoth survive re-renders. A ref is basically `{ current: value }` that React keeps for you."},{"id":27,"section":"Section 08 — Refs & Portals","question":"What is `useRef` and why do you always need `.current`?","answer":"`useRef(initial)` returns the same object `{ current: initial }` on every render. When you pass it\nto JSX as `ref={myRef}`, React puts the **DOM element** into `myRef.current` after rendering.\n\n```jsx\n// section-08-refs-and-portals/src/components/Player.jsx\nconst playerRef = useRef(null);\n\nfunction handleClick() {\n  setPlayerName(playerRef.current.value);   // .current = the \u003cinput> DOM node\n}\n\n\u003cinput ref={playerRef} type=\"text\" />\n```\n\n```text\nplayerRef           → 📦 { current: \u003cinput> }\nplayerRef.value     → undefined ❌\nplayerRef.current.value → \"Zoran\" ✅\n```\n\nThrough `ref.current` you reach every DOM property and method: `.value`, `.focus()`,\n`.showModal()`. This input is **uncontrolled** — React does not track each keystroke; you read the\nvalue only when needed."},{"id":28,"section":"Section 08 — Refs & Portals","question":"How does a parent call a function defined in a child? (`useImperativeHandle`)","answer":"`useImperativeHandle` decides **what the parent gets** in its ref. Instead of the raw `\u003cdialog>`\nDOM node, the child exposes a small custom API:\n\n```jsx\n// section-08-refs-and-portals/src/components/ResultModal/ResultModal.jsx\nexport default function ResultModal({ targetTime, remainingTime, onReset, ref }) {\n  const dialogRef = useRef();\n\n  useImperativeHandle(ref, () => ({\n    open: () => {\n      dialogRef.current.showModal();\n    },\n  }));\n  ...\n}\n\n// TimerChallenge.jsx — the parent\nconst dialogRef = useRef();\n\u003cResultModal ref={dialogRef} ... />\ndialogRef.current.open();\n```\n\n**Why:** encapsulation. The parent only knows `open()`. If the modal later stops using `\u003cdialog>`,\nonly `ResultModal` changes; `TimerChallenge` stays the same."},{"id":29,"section":"Section 08 — Refs & Portals","question":"`forwardRef` vs `ref` as a prop — what changed in React 19?","answer":"- **React 18:** `ref` was not a normal prop. A function component had to be wrapped in\n  `forwardRef((props, ref) => …)` to receive it.\n- **React 19:** `ref` is a **regular prop** for function components. `forwardRef` still works but\n  is no longer needed and will be deprecated.\n\nBoth styles are in this repo:\n\n```jsx\n// React 19 style — section-08-refs-and-portals/src/components/ResultModal/ResultModal.jsx:4\nexport default function ResultModal({ targetTime, remainingTime, onReset, ref }) { ... }\n\n// Older style — section-10-context-api-reducer/src/components/CartModal.jsx:5\nconst CartModal = forwardRef(function Modal({ title, actions }, ref) { ... });\n```"},{"id":30,"section":"Section 08 — Refs & Portals","question":"What is a Portal (`createPortal`) and why use it for modals?","answer":"`createPortal(jsx, domNode)` renders JSX into **another place in the DOM**, while in the React\ntree it stays where you wrote it (props, context and events still work normally).\n\n```jsx\n// section-08-refs-and-portals/src/components/ResultModal/ResultModal.jsx:26\nreturn createPortal(\n  \u003cdialog ref={dialogRef} onClose={onReset} className=\"result-modal\">...\u003c/dialog>,\n  document.getElementById(\"modal\"),   // \u003cdiv id=\"modal\"> in index.html\n);\n```\n\n**Why:** a modal written inside a deeply nested component would inherit its parent's\n`overflow: hidden`, `z-index` and stacking context. Rendering it next to `#root` keeps styling\nand accessibility (screen readers) predictable."},{"id":31,"section":"Section 08 — Refs & Portals","question":"How does the built-in `\u003cdialog>` element work with React?","answer":"- `dialogRef.current.showModal()` — opens it as a modal with a backdrop (needs a ref, it is a DOM\n  method).\n- `\u003cform method=\"dialog\">` — any submit button inside closes the dialog without JavaScript.\n- `onClose` — fires whenever the dialog closes, **including the ESC key**. That is why\n  `ResultModal` resets the timer in `onClose={onReset}`: otherwise ESC would close the dialog but\n  leave the timer state stale."},{"id":32,"section":"Section 10 — Context API & useReducer","question":"What is prop drilling and how does the Context API solve it?","answer":"**Prop drilling:** passing data through components that don't use it, only so that a deeply\nnested child can get it (`App → Shop → Product → button`).\n\n**Context** lets any component below a Provider read a value directly, skipping the middle layers.\n\nThree steps:\n\n```jsx\n// 1. create — section-10-context-api-reducer/src/store/shopping-cart-context.jsx:6\nexport const CartContext = createContext({\n  items: [],\n  addItemToCart: () => {},\n  updateItemQuantity: () => {},\n});\n\n// 2. provide — same file, :104\n\u003cCartContext.Provider value={ctxValue}>{children}\u003c/CartContext.Provider>\n\n// 3. consume — Product.jsx:5\nconst { addItemToCart } = useContext(CartContext);\n```\n\n**Why the default value lists functions:** it is used only when there is no Provider above, but\nit also documents the shape and gives IDE autocomplete for `addItemToCart` etc.\n\n**React 19:** you can render the context itself as the provider: `\u003cCartContext value={ctxValue}>`.\n`.Provider` still works."},{"id":33,"section":"Section 10 — Context API & useReducer","question":"Why put the Provider in its own component (`CartContextProvider`)?","answer":"```jsx\n// section-10-context-api-reducer/src/App.jsx\n\u003cCartContextProvider>\n  \u003cHeader />\n  \u003cShop>...\u003c/Shop>\n\u003c/CartContextProvider>\n```\n\n`App` no longer contains cart logic — state, reducer and handlers all live in\n`store/shopping-cart-context.jsx`. `App` only *composes* the page.\n\n**Performance bonus:** when the cart state changes, `CartContextProvider` re-renders, but\n`\u003cHeader />` and `\u003cShop>` were created by `App` and passed in as `children` — React reuses those\nsame elements. Only components that call `useContext(CartContext)` re-render."},{"id":34,"section":"Section 10 — Context API & useReducer","question":"What is `useReducer` and when do you prefer it over `useState`?","answer":"**What:** state managed by a **reducer** — a pure function `(state, action) => newState`.\nComponents don't say *how* to change state, only *what happened*, by dispatching an action.\n\n```jsx\n// section-10-context-api-reducer/src/CounterApp.jsx\nexport function counterReducer(state, action) {\n  if (action.type === \"INCREMENT\") return { count: state.count + 1 };\n  if (action.type === \"DECREMENT\") return { count: state.count - 1 };\n  if (action.type === \"RESET\")     return { count: 0 };\n  return state;\n}\n\nconst [counterState, dispatchCounterAction] = useReducer(counterReducer, { count: 0 });\n\n\u003cbutton onClick={() => dispatchCounterAction({ type: \"INCREMENT\" })}>Increment\u003c/button>\n```\n\n```text\nclick → dispatch({type}) → React calls counterReducer(oldState, action) → newState → re-render\n```\n\n**Prefer it when:** state is an object with several fields, many different updates touch it, or\nthe next state depends on the previous one in non-trivial ways (the shopping cart). All update\nlogic lives in one testable function.\n\n**Destructuring variant** (also in `CounterApp.jsx:16`):\n\n```js\nexport function counterReducer({ count }, { type }) {\n  if (type === \"INCREMENT\") return { count: count + 1 };\n  ...\n  return { count };   // no \"state\" variable any more, so return a new box\n}\n```"},{"id":35,"section":"Section 10 — Context API & useReducer","question":"Why is the reducer defined outside the component?","answer":"```js\n// section-10-context-api-reducer/src/store/shopping-cart-context.jsx:12\n// Reducer goes outside the React component\nfunction shoppingCartReducer(state, action) { ... }\n```\n\n- It needs nothing from the component scope — everything comes in through `state` and `action`.\n- It is not re-created on every render.\n- It must be **pure**: no `fetch`, no `localStorage`, no mutation. StrictMode calls reducers twice\n  to check this.\n- It can be tested alone: `shoppingCartReducer({ items: [] }, { type: \"ADD_ITEM\", payload: { id: \"p1\" } })`."},{"id":36,"section":"Section 10 — Context API & useReducer","question":"How does the shopping-cart reducer update an item immutably?","answer":"```js\n// section-10-context-api-reducer/src/store/shopping-cart-context.jsx:46\nif (action.type === \"UPDATE_ITEM\") {\n  const updatedItems = [...state.items];                       // 1. copy the array\n  const updatedItemIndex = updatedItems.findIndex(\n    (item) => item.id === action.payload.productId,\n  );\n  const updatedItem = { ...updatedItems[updatedItemIndex] };   // 2. copy the item\n\n  updatedItem.quantity += action.payload.amount;               // 3. change the COPY\n\n  if (updatedItem.quantity \u003c= 0) {\n    updatedItems.splice(updatedItemIndex, 1);                  // remove from the copy\n  } else {\n    updatedItems[updatedItemIndex] = updatedItem;\n  }\n\n  return { ...state, items: updatedItems };                    // 4. new state object\n}\n```\n\nEvery level that changes is copied (state → items array → item), so the old state is untouched\nand React sees new references.\n\n**Action shape:** `{ type, payload }` — `type` says what happened, `payload` carries the data."},{"id":37,"section":"Section 10 — Context API & useReducer","question":"What does a context value contain — data, functions, or both?","answer":"Both. The provider exposes the data **and** the functions that change it:\n\n```jsx\n// section-10-context-api-reducer/src/store/shopping-cart-context.jsx:98\nconst ctxValue = {\n  items: shoppingCartState.items,\n  addItemToCart: handleAddItemToCart,\n  updateItemQuantity: handleUpdateItemQuantity,\n};\n```\n\n`Cart.jsx` reads `items` and calls `updateItemQuantity`; `Product.jsx` only calls\n`addItemToCart`; `Header.jsx` only reads `items.length`.\n\n**Trade-off:** `ctxValue` is a new object on every provider render, so **every** consumer\nre-renders whenever anything in the cart changes — even `Product`, which only needs a function\nthat never changes. See question [48](#48-how-can-two-contexts-one-for-the-value-one-for-the-setter-avoid-re-renders) for the fix."},{"id":38,"section":"Section 10 — Context API & useReducer","question":"What is the `use` API in React 19, and why is it allowed inside `if`?","answer":"`use(resource)` reads a **Context** or a **Promise**:\n\n```jsx\nimport { use } from \"react\";\n\nfunction Product({ id, showButton }) {\n  if (showButton) {\n    const { addItemToCart } = use(CartContext);   // ✅ allowed inside if\n    ...\n  }\n}\n\nconst data = use(dataPromise);   // suspends until the promise resolves (needs \u003cSuspense>)\n```\n\n**Why it can be conditional:** normal Hooks store data *by call order*, so skipping one shifts\nthe rest. `use` stores nothing in that slot list — it just reads the current context value or the\npromise's result — so it may be called in `if` and loops.\n\n**Limits:** it must still be called inside a component or a Hook (not in an event handler or a\nplain helper), and not inside `try/catch`."},{"id":39,"section":"Section 11 — useEffect & side effects","question":"What is a side effect and when do you need `useEffect`?","answer":"**Side effect:** anything a component does besides returning JSX — timers, `fetch`, geolocation,\n`localStorage`, manual DOM calls.\n\n**Need `useEffect`:** when the effect must run **because the component rendered** and nothing in\nthe render itself can trigger it. Example: getting the user's location when `App` first appears:\n\n```jsx\n// section-11-useEffect/src/App.jsx:26\nuseEffect(() => {\n  navigator.geolocation.getCurrentPosition(\n    (position) => {\n      setAvailablePlaces(sortPlacesByDistance(AVAILABLE_PLACES, position.coords.latitude, position.coords.longitude));\n    },\n    () => {\n      // Location unavailable: show places unsorted instead of \"loading...\" forever\n      setAvailablePlaces(AVAILABLE_PLACES);\n    },\n  );\n}, []);\n```\n\nCalling `setAvailablePlaces` directly in the component body would cause render → setState →\nrender → … an **infinite loop**. In an effect it runs once after the first render:\n\n```text\nrender (empty list, \"loading...\") → screen painted → effect → setState → render (sorted list)\n```\n\n**Don't need `useEffect`:**\n\n- In an **event handler** — the click already tells you when to run it:\n\n  ```jsx\n  // App.jsx:64 — this is a side effect, but NOT useEffect\n  // (and Hooks can't be called inside a function anyway)\n  localStorage.setItem(\"selectedPlaces\", JSON.stringify([id, ...storedIds]));\n  ```\n\n- **Synchronous** code that only needs to run once — put it at module level:\n\n  ```jsx\n  // App.jsx:10 — runs once when the file loads, before App() is ever called\n  const storedIds = JSON.parse(localStorage.getItem(\"selectedPlaces\")) || [];\n  ```"},{"id":40,"section":"Section 11 — useEffect & side effects","question":"How does `useEffect` decide when to run? What do the dependency arrays mean?","answer":"**What React does:** it does **not** run your effect function during render. It stores it, paints\nthe screen first, then runs it. On the next render it compares the old and new dependency arrays\nvalue by value (`Object.is`) and runs the effect again only if something changed.\n\n**Analogy — an alarm that checks a list:** after every paint React looks at the list (the\ndependency array). If anything on it is different from last time, the alarm rings and the effect\nruns.\n\n```text\nuseEffect(fn)              → no array\n   runs: after EVERY render\n\nuseEffect(fn, [])          → empty list, nothing can change\n   runs: only ONCE, after the first render (mount)\n\nuseEffect(fn, [onConfirm]) → list with values\n   runs: after the first render + every time onConfirm changes\n```\n\n**Rule:** an effect always runs after the first paint; after that, only when something in the\narray changed.\n\n**In short:** `[]` → once, when the component appears · `[x]` → on appear and on every change of\n`x` · no array → after every render."},{"id":41,"section":"Section 11 — useEffect & side effects","question":"When does the `useEffect` cleanup function run?","answer":"The function you `return` from an effect is the cleanup. It runs in exactly two cases:\n\n1. **Before unmount** — the component is removed from the screen.\n2. **Before the same effect runs again**, because a dependency changed.\n\nIt does **not** run before other functions or before other effects.\n\n```jsx\n// section-11-useEffect/src/components/DeleteConfirmation.jsx:7\nuseEffect(() => {\n  const timer = setTimeout(() => {\n    onConfirm();\n  }, TIMER);\n\n  return () => {\n    clearTimeout(timer);\n  };\n}, [onConfirm]);\n```\n\n```text\nRe-run:   render → screen painted → cleanup of the old effect → new effect\nUnmount:  cleanup only\n```\n\n**In this app:**\n\n- open the modal → `DeleteConfirmation` mounts → effect starts a 3 s timer;\n- click **No** → the component disappears → cleanup clears the timer, so the place is **not**\n  deleted;\n- if `onConfirm` changed while the modal is open → cleanup clears the old timer, the effect starts\n  a new one.\n\nWithout cleanup, clicking \"No\" would still delete the place 3 seconds later.\n\n`progressBar.jsx` does the same with `setInterval` / `clearInterval`.\n\n**Dev-only confusion:** in `\u003cStrictMode>` React runs mount → cleanup → mount, so the console shows\n\"Set timer / Clearing up timer / Set timer\". That is not a bug and does not happen in production."},{"id":42,"section":"Section 11 — useEffect & side effects","question":"Why does a function in the dependency array need `useCallback`?","answer":"Every time `App()` runs, `function handleRemovePlace() {}` creates a **new function object**.\nTwo functions with identical code are still different objects (`fnA !== fnB`), so\n`[onConfirm]` looks \"changed\" on every `App` render → the effect re-runs every time. If the\neffect itself causes the parent to re-render, you get an **infinite loop**; at minimum the 3 s\ntimer restarts on every parent render.\n\n**Fix:** `useCallback` returns the **same** function object between renders until its own\ndependencies change. It is applied to the **original** function — `handleRemovePlace` in `App`,\nbecause `onConfirm={handleRemovePlace}`:\n\n```jsx\n// section-11-useEffect/src/App.jsx:76\nconst handleRemovePlace = useCallback(function handleRemovePlace() {\n  setPickedPlaces((prev) => prev.filter((place) => place.id !== selectedPlace.current));\n  setModalIsOpen(false);\n  ...\n}, []);   // uses only setters and a ref — both stable, so [] is correct\n```\n\n```text\nwithout useCallback: render 1 → fn#1, render 2 → fn#2  → [onConfirm] changed → effect re-runs\nwith useCallback:    render 1 → fn#1, render 2 → fn#1  → nothing changed    → effect stays\n```"},{"id":43,"section":"Section 11 — useEffect & side effects","question":"How can `useEffect` keep a DOM API in sync with a prop? (Modal `open`)","answer":"```jsx\n// section-11-useEffect/src/components/Modal.jsx:11\nuseEffect(() => {\n  open && dialog.current.showModal();\n  !open && dialog.current.close();\n}, [open]);\n```\n\n**Why an effect is needed:** `showModal()` needs the DOM node in `dialog.current`, which only\nexists **after** the first render. Calling it during render would crash on `undefined`.\n\n**Two ways to control a modal:**\n\n- **Declarative (here):** the parent sets state `modalIsOpen` and passes `open={modalIsOpen}`.\n  The effect syncs the `\u003cdialog>` with the prop. The parent never touches the DOM.\n- **Imperative (section 08):** `useImperativeHandle` exposes `open()` and the parent calls\n  `ref.current.open()`.\n\nThe declarative version keeps \"is the modal open?\" in React state, so the UI can't drift from it.\nThe imperative version is handy when the parent should only *trigger* the modal without owning\nstate for it."},{"id":44,"section":"Section 12 — Optimization & how React renders","question":"When does a component re-render, and in what order?","answer":"A component re-renders when:\n\n1. its own state changes,\n2. its **parent** re-renders (props changed or not!),\n3. a context it consumes changes.\n\n```jsx\n// section-12-optimization/src/App.jsx:26\n// components render in order, top to bottom; this also happens when App() re-renders\n// so we should avoid that and create encapsulation so only what must re-render does\n```\n\nWhen `App`'s `chosenCount` changes, `App()` runs again, and so do `Header`, `SetCounter`,\n`Counter`, … top to bottom — even though `Header` has no props. React then compares the result\nwith the real DOM and updates only what differs, but the function calls still cost time.\n\nOpen the console: `log.js` prints each render with indentation showing the tree depth."},{"id":45,"section":"Section 12 — Optimization & how React renders","question":"Why is component composition the most important optimization?","answer":"**Move state down to the component that uses it.** Originally the number input state lived in\n`App`, so every keystroke re-rendered the whole app:\n\n```jsx\n// section-12-optimization/src/App.jsx:10 — the old version\n// // const runs on every render\n// // when state changes, the whole App() function is re-rendered\n// const [enteredNumber, setEnteredNumber] = useState(0);\n```\n\nIt was moved into its own component:\n\n```jsx\n// section-12-optimization/src/components/SetCounter/SetCounter.jsx\nconst [enteredNumber, setEnteredNumber] = useState(0);   // typing re-renders only SetCounter\n...\nfunction handleSetClick() {\n  onSet(enteredNumber);   // App learns the value only on click\n}\n```\n\n**Rule:** every component should be agnostic of the others and own only the state it needs. This\ncosts nothing at runtime, unlike `memo`, which adds a props comparison on every render. Try\ncomposition first."},{"id":46,"section":"Section 12 — Optimization & how React renders","question":"What does `memo` do, and why is it used together with `useCallback`?","answer":"**`memo(Component)`:** before re-rendering, React compares the new props with the old ones\n(shallow, `Object.is` per prop). All equal → skip this component **and its whole subtree**.\n\n```jsx\n// section-12-optimization/src/components/Counter/Counter.jsx:26\nconst Counter = memo(function Counter({ initialCount }) { ... });\n```\n\nWhen `App` re-renders and `initialCount` is still `0`, `Counter` is skipped.\n\n**Why `useCallback` is needed with it:** a function prop is a new object on every render, so\n`memo` would always see \"changed\":\n\n```jsx\n// Counter.jsx:37\nconst handleDecrement = useCallback(function handleDecrement() {\n  setCounter((prevCounter) => prevCounter - 1);\n}, []);\n\n\u003cIconButton icon={MinusIcon} onClick={handleDecrement}>Decrement\u003c/IconButton>\n// IconButton is memo(...) — with a stable onClick it skips re-rendering\n```\n\n```text\nmemo alone:          onClick fn#1 → fn#2 → \"props changed\" → re-render anyway ❌\nmemo + useCallback:  onClick fn#1 → fn#1 → \"props equal\"   → skipped ✅\n```\n\n**Don't wrap everything:** the comparison itself costs time. Use `memo` high in the tree, on\ncomponents whose props rarely change."},{"id":47,"section":"Section 12 — Optimization & how React renders","question":"What does `useMemo` do, and what happens with `[]` vs no dependency array?","answer":"**What:** caches the **result** of a calculation and recomputes it only when a dependency changes.\n(`memo` = skip a component; `useCallback` = keep a function; `useMemo` = keep a computed value.)\n\n```jsx\n// section-12-optimization/src/components/Counter/Counter.jsx:30\nconst initialCountIsPrime = useMemo(\n  () => isPrime(initialCount),\n  [initialCount],\n);\n```\n\nClicking + / − changes `counter` and re-renders `Counter`, but `initialCount` stays the same, so\n`isPrime` does **not** run again (watch the \"Calculating if is prime number\" log).\n\n**Dependencies:**\n\n```text\nuseMemo(fn, [initialCount]) → runs on first render + when initialCount changes\nuseMemo(fn, [])             → runs ONCE, never again\nuseMemo(fn)                 → runs on EVERY render (no caching at all)\n```\n\n> Correction to my old note \"it will never execute if we do not provide dependency\": with `[]` it\n> runs once; *omitting* the array recomputes every render.\n\nUse it only for expensive calculations — caching a cheap expression costs more than it saves."},{"id":48,"section":"Section 12 — Optimization & how React renders","question":"How can two contexts (one for the value, one for the setter) avoid re-renders?","answer":"Instead of passing `setCounter` down through props (and stabilizing it with `memo` +\n`useCallback`), the buttons can read it from Context. The trick is **two contexts**:\n\n```jsx\nconst CounterValueContext  = createContext(0);\nconst CounterSetterContext = createContext(() => {});\n\nfunction CounterProvider({ children }) {\n  const [counter, setCounter] = useState(0);\n  return (\n    \u003cCounterSetterContext value={setCounter}>        {/* setCounter never changes */}\n      \u003cCounterValueContext value={counter}>{children}\u003c/CounterValueContext>\n    \u003c/CounterSetterContext>\n  );\n}\n\n// buttons:  const setCounter = useContext(CounterSetterContext);  → never re-render\n// output:   const counter    = useContext(CounterValueContext);   → re-renders on change\n```\n\n**Why:** a component re-renders when the context *it reads* changes. Buttons only read the setter,\nwhich React guarantees is stable — so a counter change re-renders only the output. With one\ncontext `{ counter, setCounter }`, every consumer would re-render (the problem from question\n[37](#37-what-does-a-context-value-contain--data-functions-or-both))."},{"id":49,"section":"Section 12 — Optimization & how React renders","question":"Why does `console.log` right after `setState` show the old value?","answer":"```jsx\n// section-12-optimization/src/App.jsx:21\nfunction handleSetCount(newCount) {\n  setChosenCount((prevChosenCount) => prevChosenCount + 1);\n  console.log(chosenCount); // won't work — prints the OLD value\n}\n```\n\n**Scheduling:** `setChosenCount` does not change the value immediately. `chosenCount` is a plain\n`const` inside one call of `App()`. Calling the setter only writes a note \"change chosenCount\" and\nputs it in a queue. The current function call finishes with the old value. After your handler,\nReact reads all the notes, calls `App()` again, and only then `useState` returns the new value.\n\n**Batching:** all updates from the same event are processed together, in **one** render.\n\n**Analogy — waiter and kitchen:** the waiter (your handler) writes orders on notes. The kitchen\n(React) does not cook after every note, but once the waiter finishes the whole table, all at once."},{"id":50,"section":"Section 12 — Optimization & how React renders","question":"Where does React store state, and what does `key` have to do with it?","answer":"React does **not** keep state inside the `Counter()` function. It keeps it in a **drawer** attached\nto the component's place in the tree. The drawer is identified by three things: **component\ntype, position, and `key`**.\n\n- **First render (mount):** no drawer yet. React creates one and puts `initialCount` in it.\n- **Every later render:** the drawer exists, so React returns what is in it and **completely\n  ignores** the `initialCount` argument.\n\nThat is why changing the `initialCount` prop alone does not reset the counter.\n\n**`key` is React's identity label.** When the label changes, React treats it as a different\ncomponent: it throws away the old one together with its state and builds a new one from scratch.\n\n```jsx\n// section-12-optimization/src/App.jsx:43 — using key={chosenCount} forces a reset\n\u003cCounterWithHistory key={chosenCount} initialCount={chosenCount} />\n```\n\n```text\nkey=0 → drawer#0 { counterChanges: [0, +1, +1] }\nset 5 → key=5 → drawer#0 thrown away, drawer#5 { counterChanges: [5] } ✅\n```\n\nThe commented-out `useEffect` in `CounterWithHistory.jsx:40` is the worse alternative: it renders\nonce with stale state, then resets it in an effect and renders again. `key` does it in one step."},{"id":51,"section":"Section 12 — Optimization & how React renders","question":"Why must list keys be unique and stable?","answer":"```jsx\n// section-12-optimization/src/components/Counter/CounterHistory.jsx:24\n// React tracks state by position, so every list element needs a unique id\n{history.map((count) => (\n  \u003cHistoryItem key={count.id} count={count.value} />\n))}\n```\n\nEach `HistoryItem` has its own `selected` state. New changes are **prepended** to the list:\n\n```text\nkey = index:  [A(selected), B] → prepend C → [C, A, B]\n              C gets index 0 → inherits A's drawer → C looks selected ❌\nkey = id:     C gets a new drawer, A keeps its own → selection stays on A ✅\n```\n\nIndexes are fine only for lists that never reorder, insert or delete. `Math.random()` as an id is\nfine **when created once** with the data (as here); generating it inside `.map()` would give a new\nkey every render and remount every item."},{"id":52,"section":"Section 12 — Optimization & how React renders","question":"What is Million.js and what does `// million-ignore` mean?","answer":"Million.js is a compiler plugin that replaces React's virtual-DOM diffing for suitable components\nwith a faster \"block\" renderer that updates only the dynamic parts.\n\n```js\n// section-12-optimization/vite.config.js\nplugins: [million.vite({ auto: true }), react()],\n```\n\n`auto: true` lets it pick components automatically. `// million-ignore` above a component opts it\nout — used on the SVG icons (`UI/Icons/*.jsx`), which are passed as components to `IconButton` and\nmust stay normal React components.\n\nIt is an optional extra; the core techniques (composition, `memo`, `useCallback`, `useMemo`, keys)\nare what interviews ask about."}];

    const PROGRESS_KEY = "react-quiz-progress-v1";
    const PREFS_KEY = "react-quiz-prefs-v1";
    const SECTIONS = [...new Set(QUESTIONS.map((q) => q.section))];
    const BY_ID = new Map(QUESTIONS.map((q) => [q.id, q]));

    // Storage can be missing (private window, blocked site data) — the quiz still works, it just forgets.
    function loadJSON(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key)) ?? fallback;
      } catch {
        return fallback;
      }
    }
    function saveJSON(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    const prefs = loadJSON(PREFS_KEY, {});
    const state = {
      mode: prefs.mode === "browse" ? "browse" : "quiz",
      section: SECTIONS.includes(prefs.section) ? prefs.section : "all",
      filter: prefs.filter || "all",
      shuffle: Boolean(prefs.shuffle),
      search: "",
      progress: loadJSON(PROGRESS_KEY, {}), // { [id]: "known" | "review" }
      deck: [],
      index: 0,
      revealed: false,
      open: new Set(), // expanded items in browse mode
    };

    const $ = (selector) => document.querySelector(selector);
    const view = $("#view");

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }
    function statusOf(id) {
      return state.progress[id] || "new";
    }
    function shortSection(section) {
      return section.replace(/^Section /, "");
    }

    // ---------- Markdown ----------
    const answerCache = new Map();

    function renderInline(text) {
      return window.marked ? marked.parseInline(text) : escapeHtml(text);
    }
    function renderAnswer(q) {
      if (!answerCache.has(q.id)) {
        // Offline fallback: without the CDN libraries, show the raw markdown.
        const html = window.marked
          ? marked.parse(q.answer)
          : `<pre><code>${escapeHtml(q.answer)}</code></pre>`;
        answerCache.set(q.id, html);
      }
      return answerCache.get(q.id);
    }
    function highlightIn(element) {
      if (!window.hljs) return;
      element.querySelectorAll("pre code").forEach((block) => hljs.highlightElement(block));
    }

    // ---------- Deck ----------
    function matchesFilters(q) {
      const sectionOk = state.section === "all" || q.section === state.section;
      const filterOk = state.filter === "all" || statusOf(q.id) === state.filter;
      return sectionOk && filterOk;
    }

    function shuffled(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Decides which questions the quiz asks and in what order.
    // Tweak here to change the study strategy (e.g. put "review" questions first).
    function buildDeck() {
      const deck = QUESTIONS.filter(matchesFilters);
      return state.shuffle ? shuffled(deck) : deck;
    }

    function restartDeck() {
      state.deck = buildDeck();
      state.index = 0;
      state.revealed = false;
    }

    function savePrefs() {
      saveJSON(PREFS_KEY, {
        mode: state.mode,
        section: state.section,
        filter: state.filter,
        shuffle: state.shuffle,
        theme: document.documentElement.dataset.theme,
      });
    }

    function grade(id, status) {
      state.progress[id] = status;
      saveJSON(PROGRESS_KEY, state.progress);
      renderStats();
    }

    // ---------- Header stats ----------
    function renderStats() {
      const total = QUESTIONS.length;
      const known = QUESTIONS.filter((q) => statusOf(q.id) === "known").length;
      const review = QUESTIONS.filter((q) => statusOf(q.id) === "review").length;
      const unseen = total - known - review;

      $("#progress-bar").innerHTML =
        `<div class="known" style="width:${(known / total) * 100}%"></div>` +
        `<div class="review" style="width:${(review / total) * 100}%"></div>`;
      $("#stats").innerHTML =
        `<span><span class="sw" style="background:var(--known)"></span>Known <b>${known}</b></span>` +
        `<span><span class="sw" style="background:var(--review)"></span>To review <b>${review}</b></span>` +
        `<span><span class="sw" style="background:var(--border)"></span>Not seen <b>${unseen}</b></span>` +
        `<span>Total <b>${total}</b></span>`;
    }

    // ---------- Controls ----------
    function renderControls() {
      document.querySelectorAll(".seg button").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.mode === state.mode));
      });
      $("#section-select").value = state.section;
      $("#filter-select").value = state.filter;
      $("#shuffle").checked = state.shuffle;
      $("#shuffle-wrap").hidden = state.mode !== "quiz";
      $("#search").hidden = state.mode !== "browse";
    }

    function gradeButtons(id) {
      const current = statusOf(id);
      return `
        <div class="grade">
          <button type="button" data-grade="known" data-id="${id}" aria-pressed="${current === "known"}">✓ I knew it <kbd>1</kbd></button>
          <button type="button" data-grade="review" data-id="${id}" aria-pressed="${current === "review"}">↻ Review again <kbd>2</kbd></button>
        </div>`;
    }

    // ---------- Quiz view ----------
    function renderQuiz() {
      const { deck, index } = state;

      if (deck.length === 0) {
        view.innerHTML = `<div class="card empty">No questions match these filters.</div>`;
        return;
      }
      if (index >= deck.length) {
        renderDone();
        return;
      }

      const q = deck[index];
      const status = statusOf(q.id);
      view.innerHTML = `
        <article class="card">
          <div class="card-meta">
            <span class="chip">${escapeHtml(shortSection(q.section))}</span>
            <span>${index + 1} / ${deck.length}</span>
          </div>
          <h2 class="question"><span class="qnum">#${q.id}</span>${renderInline(q.question)}</h2>
          <button type="button" class="reveal" data-action="reveal" aria-expanded="${state.revealed}">
            ${state.revealed ? "hide answer" : "more-info"}
          </button>
          ${state.revealed ? `<div class="answer">${renderAnswer(q)}</div>${gradeButtons(q.id)}` : ""}
        </article>
        <nav class="quiz-nav">
          <button type="button" data-action="prev" ${index === 0 ? "disabled" : ""}>← Prev</button>
          <span class="pill" data-status="${status}">${status === "new" ? "not seen" : status === "known" ? "known" : "to review"}</span>
          <button type="button" data-action="next">${index === deck.length - 1 ? "Finish" : "Next →"}</button>
        </nav>
        <p class="hint"><kbd>Space</kbd> show / hide · <kbd>←</kbd> <kbd>→</kbd> navigate · <kbd>1</kbd> knew it · <kbd>2</kbd> review again</p>`;
      highlightIn(view);
    }

    function renderDone() {
      const ids = state.deck.map((q) => q.id);
      const known = ids.filter((id) => statusOf(id) === "known").length;
      const review = ids.filter((id) => statusOf(id) === "review").length;
      view.innerHTML = `
        <div class="card done">
          <h2>Round finished 🎉</h2>
          <p>${ids.length} ${ids.length === 1 ? "question" : "questions"} ·<b style="color:var(--known)">${known} known</b> · <b style="color:var(--review)">${review} to review</b></p>
          <div class="actions">
            ${review > 0 ? `<button type="button" class="reveal" data-action="drill-review">Drill the ${review} to review</button>` : ""}
            <button type="button" class="reveal" data-action="restart">Start this round again</button>
          </div>
        </div>`;
    }

    function goTo(index) {
      state.index = Math.max(0, Math.min(index, state.deck.length));
      state.revealed = false;
      renderQuiz();
      window.scrollTo({ top: 0 });
    }

    // ---------- Browse view ----------
    function renderBrowse() {
      const term = state.search.trim().toLowerCase();
      const visible = QUESTIONS.filter(
        (q) => matchesFilters(q) && (!term || (q.question + "\n" + q.answer).toLowerCase().includes(term)),
      );

      if (visible.length === 0) {
        view.innerHTML = `<p class="empty">No questions match.</p>`;
        return;
      }

      const groups = SECTIONS.map((section) => [section, visible.filter((q) => q.section === section)])
        .filter(([, items]) => items.length > 0);

      view.innerHTML = groups
        .map(([section, items]) => `
          <section class="group">
            <h2>${escapeHtml(section)}</h2>
            <ol class="list">${items.map(browseItem).join("")}</ol>
          </section>`)
        .join("");
      highlightIn(view);
    }

    function browseItem(q) {
      const isOpen = state.open.has(q.id);
      return `
        <li class="item" id="q-${q.id}" data-status="${statusOf(q.id)}">
          <div class="item-head">
            <span class="qnum">${q.id}.</span>
            <span class="item-q">${renderInline(q.question)}</span>
            <span class="dot" title="${statusOf(q.id)}"></span>
          </div>
          <button type="button" class="reveal small" data-action="toggle" data-id="${q.id}" aria-expanded="${isOpen}">
            ${isOpen ? "hide answer" : "more-info"}
          </button>
          ${isOpen ? `<div class="answer">${renderAnswer(q)}</div>${gradeButtons(q.id)}` : ""}
        </li>`;
    }

    // Cross-links inside answers look like "#50-where-does-react-store-state...".
    function jumpToQuestion(id) {
      if (!BY_ID.has(id)) return;
      if (state.mode === "quiz") {
        const deckIndex = state.deck.findIndex((q) => q.id === id);
        if (deckIndex !== -1) {
          goTo(deckIndex);
          return;
        }
      }
      // Not in the current deck: show it in Browse with filters cleared.
      state.mode = "browse";
      state.section = "all";
      state.filter = "all";
      state.search = "";
      $("#search").value = "";
      state.open.add(id);
      savePrefs();
      restartDeck(); // keep the quiz deck in sync with the cleared filters
      render();
      const item = document.getElementById(`q-${id}`);
      item.scrollIntoView({ behavior: "smooth", block: "center" });
      item.classList.add("flash");
      setTimeout(() => item.classList.remove("flash"), 1500);
    }

    // ---------- Render + events ----------
    function render() {
      renderControls();
      renderStats();
      if (state.mode === "quiz") renderQuiz();
      else renderBrowse();
    }

    view.addEventListener("click", (event) => {
      const link = event.target.closest('a[href^="#"]');
      if (link) {
        const match = link.getAttribute("href").match(/^#(\d+)-/);
        if (match) {
          event.preventDefault();
          jumpToQuestion(Number(match[1]));
        }
        return;
      }

      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.grade) {
        const id = Number(button.dataset.id);
        grade(id, button.dataset.grade);
        if (state.mode === "quiz") {
          goTo(state.index + 1);
        } else {
          const item = document.getElementById(`q-${id}`);
          item.dataset.status = button.dataset.grade;
          item.querySelectorAll("[data-grade]").forEach((b) => {
            b.setAttribute("aria-pressed", String(b === button));
          });
        }
        return;
      }

      switch (button.dataset.action) {
        case "reveal":
          state.revealed = !state.revealed;
          renderQuiz();
          break;
        case "prev":
          goTo(state.index - 1);
          break;
        case "next":
          goTo(state.index + 1);
          break;
        case "restart":
          restartDeck();
          renderQuiz();
          break;
        case "drill-review":
          state.filter = "review";
          savePrefs();
          restartDeck();
          render();
          break;
        case "toggle": {
          const id = Number(button.dataset.id);
          if (state.open.has(id)) state.open.delete(id);
          else state.open.add(id);
          const item = document.getElementById(`q-${id}`);
          item.outerHTML = browseItem(BY_ID.get(id));
          highlightIn(document.getElementById(`q-${id}`));
          break;
        }
      }
    });

    document.querySelectorAll(".seg button").forEach((button) => {
      button.addEventListener("click", () => {
        state.mode = button.dataset.mode;
        savePrefs();
        render();
      });
    });

    function onFilterChange() {
      savePrefs();
      restartDeck();
      render();
    }
    $("#section-select").addEventListener("change", (e) => {
      state.section = e.target.value;
      onFilterChange();
    });
    $("#filter-select").addEventListener("change", (e) => {
      state.filter = e.target.value;
      onFilterChange();
    });
    $("#shuffle").addEventListener("change", (e) => {
      state.shuffle = e.target.checked;
      onFilterChange();
    });
    $("#search").addEventListener("input", (e) => {
      state.search = e.target.value;
      renderBrowse();
    });
    $("#reset").addEventListener("click", () => {
      if (!confirm("Forget which questions you know? This cannot be undone.")) return;
      state.progress = {};
      saveJSON(PROGRESS_KEY, state.progress);
      restartDeck();
      render();
    });

    document.addEventListener("keydown", (event) => {
      if (state.mode !== "quiz" || event.metaKey || event.ctrlKey || event.altKey) return;
      if (event.target.closest("input, select, textarea")) return;
      const q = state.deck[state.index];

      if (event.key === " " && q) {
        event.preventDefault();
        state.revealed = !state.revealed;
        renderQuiz();
      } else if (event.key === "ArrowRight") {
        goTo(state.index + 1);
      } else if (event.key === "ArrowLeft") {
        goTo(state.index - 1);
      } else if ((event.key === "1" || event.key === "2") && q && state.revealed) {
        grade(q.id, event.key === "1" ? "known" : "review");
        goTo(state.index + 1);
      }
    });

    // ---------- Theme ----------
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      $("#hljs-light").disabled = theme === "dark";
      $("#hljs-dark").disabled = theme !== "dark";
    }
    $("#theme-toggle").addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
      savePrefs();
    });

    // ---------- Init ----------
    $("#section-select").innerHTML =
      `<option value="all">All sections</option>` +
      SECTIONS.map((s) => `<option value="${escapeHtml(s)}">${escapeHtml(shortSection(s))}</option>`).join("");

    applyTheme(prefs.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    restartDeck();
    render();
  </script>
</body>
</html>
